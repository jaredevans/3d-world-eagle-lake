<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; }</style>
<title>Bald Eagle Flight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Young+Serif&display=swap">
<style>
/* Layout: full-bleed landscape canvas, name card top-left, toggles and distance switch docked bottom-centre */
:root {
  --sky-top: #2c3a6e;
  --sky-horizon: #f2a46a;
  --ink: #16243f;
  --ink-soft: #4a5a78;
  --on-ink: #f6f8fc;
  --glass: rgba(248, 251, 255, 0.8);
  --glass-strong: rgba(255, 255, 255, 0.94);
  --glass-edge: rgba(22, 36, 63, 0.14);
  --accent: #e8b021; /* the eagle's yellow beak */
  --on-accent: #2a1a05;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky-horizon);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  display: grid;
  gap: 4px;
  padding: 12px 16px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  max-width: calc(100% - 32px);
}
.eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.eyebrow i { font-weight: 400; text-transform: none; letter-spacing: 0.02em; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 26px;
  line-height: 1.1;
  text-wrap: balance;
}
.readout {
  margin: 4px 0 0;
  font-size: 14px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.readout strong { color: var(--ink); font-weight: 700; font-size: 18px; }
.hint { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
.hint-touch { display: none; }
@media (hover: none) {
  .hint-mouse { display: none; }
  .hint-touch { display: inline; }
}

.dock {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 32px);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.toggles { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.toggle,
.controls {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(22, 36, 63, 0.16);
}
.controls { display: flex; gap: 4px; padding: 5px; }
.dock button {
  appearance: none;
  margin: 0;
  color: var(--ink);
  font: 600 15px/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}
.controls button { border: 0; padding: 11px 20px; border-radius: 999px; background: transparent; }
.controls button:hover { background: rgba(22, 36, 63, 0.08); }
.controls button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.dock .toggle { padding: 9px 16px; font-size: 14px; }
.dock .toggle:hover { background: var(--glass-strong); }
.dock .toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.dock button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.dock kbd {
  font: 400 11px/1 var(--font-ui);
  opacity: 0.55;
  margin-left: 6px;
}
@media (max-width: 420px) {
  .controls button { padding: 11px 15px; }
  .dock kbd { display: none; }
}
@media (hover: none) { .dock kbd { display: none; } }
</style>

<canvas id="scene" aria-label="An American bald eagle over a lake through a looping day: it snatches fish and eats them on a dead tree or carries them to its nest in a tall pine, where its mate stands guard over two begging eaglets, and now and then it chases an osprey until it drops its catch. A waterfall pours off a rocky bluff into a stream that winds down to the lake, where beavers tow branches to their lodge at dusk and slap their tails in alarm. Deer graze, a fox and a heron hunt, ducks paddle, otters porpoise and haul out on a rock, turtles bask on a log, a kingfisher dives from its perch, a loon dives with its chick on its back and takes off on a long splashing run, a bull moose wades in at dawn to dunk for water plants, a black bear eats berries behind the camp, a woodpecker drums on the dead tree, a hummingbird zips about the camp, frogs croak on the lily pads, water lilies open by day and butterflies and dragonflies flit about. Two campers by their tent point up as the eagle passes overhead, fish from the shore at dawn, paddle a canoe round the lake on calm mornings, shelter from the rain, toast marshmallows round the fire at dusk and lie out under the northern lights, and hurry into the tent when the bear wanders into camp; on some nights a raccoon raids their cooler while they sleep. Some afternoons a floatplane lands on the lake in a burst of spray and takes off again, and on calm mornings a hot-air balloon drifts across the valley, its burner flaring. A great snow-capped mountain rises beyond the foothills, its snow glistening in the sun and flushing pink at dawn and dusk. On fine days turkey vultures circle up on rising warm air, a red-tailed hawk circles screaming over the meadow, and airliners draw contrails across the sky that linger when rain is on the way, after high cloud brings a halo and sundogs round the sun. A spider's web glitters with dew at dawn and a small rainbow hangs in the waterfall's spray. Bats and an owl come out at night, wolves howl in the distance, satellites and shooting stars (some nights a meteor shower) cross the sky, the moon lays a glittering path across the water and the weather turns from sunshine to thunderstorms"></canvas>

<div class="card">
  <p class="eyebrow">American bald eagle · <i>Haliaeetus leucocephalus</i></p>
  <h1>Bald Eagle Flight</h1>
  <p class="readout"><strong id="readout">9.0</strong> m from camera</p>
  <p class="readout" id="clock">05:36 · Dawn</p>
  <p class="readout" id="view-name" hidden></p>
  <p class="hint"><span class="hint-mouse">Drag to look around the eagle, scroll to zoom. Double-click to reset, or press R for the front of the lake.</span><span class="hint-touch">Drag to look around the eagle. Double-tap to reset.</span></p>
</div>

<div class="dock">
  <div class="toggles">
    <button type="button" id="btn-follow" class="toggle" aria-pressed="false">Follow eagle<kbd>F</kbd></button>
    <button type="button" id="btn-eye" class="toggle" aria-pressed="false">Eagle’s-eye<kbd>E</kbd></button>
    <button type="button" id="btn-look" class="toggle" aria-pressed="false">Look around<kbd>L</kbd></button>
    <button type="button" id="btn-cycle" class="toggle" aria-pressed="false">Cycle view<kbd>C</kbd></button>
    <button type="button" id="btn-sound" class="toggle" aria-pressed="false">Sound<kbd>M</kbd></button>
  </div>
  <div class="controls" role="group" aria-label="Distance between the eagle and the camera">
    <button type="button" id="btn-close" data-distance="close" aria-pressed="false">Close<kbd>1</kbd></button>
    <button type="button" id="btn-away" data-distance="away" aria-pressed="true">Away<kbd>2</kbd></button>
    <button type="button" id="btn-far" data-distance="far" aria-pressed="false">Far away<kbd>3</kbd></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DISTANCES = { close: 3.2, away: 9, far: 30 };
const HORIZON = new THREE.Color(0xf7a35c);
// Directions to the sun and moon, moved across the sky by the day cycle
const SUN_DIR = new THREE.Vector3(-0.05, 0.12, -1).normalize();
const MOON_DIR = new THREE.Vector3(0.05, -0.12, -1).normalize();
// Layer for the water surface and its effects, which the reflection camera must not see
const NOT_REFLECTED = 1;
// Moon phase as the angle of sunlight across it: 0 is new, π is full; it starts waxing gibbous
const MOON_START_PHASE = 2.4;
const LUNAR_NIGHTS = 8; // a full cycle of phases takes this many days
const motionScale = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.5 : 1;
const { smoothstep, smootherstep, lerp, clamp } = THREE.MathUtils;
// Fraction of the remaining gap to close this frame, for frame-rate independent easing
const easeFactor = (dt, rate) => 1 - Math.exp(-dt * rate);
const turnTowards = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
// Let every solid mesh in a group cast shadows (see-through bits such as duck wakes don't)
const castShadows = object => object.traverse(o => {
  if (o.isMesh && !o.material.transparent) o.castShadow = true;
});

// Small seeded random so the scenery is the same on every load
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7);

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Shadows are drawn once per frame and shared by the reflection and main renders
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe39a72, 45, 420);

const CAMERA_FOV = 55;
const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.05, 1200);
camera.layers.enable(NOT_REFLECTED);
const HOME_POSITION = new THREE.Vector3(0, 0, 0);
const HOME_TARGET = new THREE.Vector3(0, 0.3, -10);
camera.position.copy(HOME_POSITION);
camera.lookAt(HOME_TARGET);

// Sky colour for a view direction, shared by the sky dome and the lake
const SKY_GLSL = `uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; uniform vec3 sunColor; uniform vec3 sunDir;
  uniform float sunVis; uniform vec3 moonDir; uniform float moonVis; uniform float moonPhase; uniform float moonLit;
  uniform float haze; uniform vec3 cirrusColor; uniform float skyTime; uniform float halo; uniform float sundogs; uniform float sundogGap;
  float skyHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float skyNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(skyHash(i), skyHash(i + vec2(1.0, 0.0)), f.x), mix(skyHash(i + vec2(0.0, 1.0)), skyHash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  vec3 skyColor(vec3 dir) {
    vec3 col = mix(horizon, mid, smoothstep(0.02, 0.22, dir.y));
    col = mix(col, top, smoothstep(0.18, 0.65, dir.y));
    float s = max(dot(dir, sunDir), 0.0);
    col += sunColor * (pow(s, 6.0) * 0.35 + pow(s, 80.0) * 0.6);
    col = mix(col, vec3(1.0, 0.93, 0.75), smoothstep(0.9992, 0.9995, s) * sunVis);
    // High cloud ahead of rain: a thin milky veil with long fibrous wisps drifting through it
    if (haze > 0.001 && dir.y > 0.0) {
      vec2 p = dir.xz / (dir.y + 0.15) * 2.0 + vec2(skyTime * 0.02, skyTime * 0.006);
      vec2 q = vec2(p.x * 0.4, p.y * 3.5 + sin(p.x * 0.7) * 0.8);
      float n = skyNoise(q) * 0.55 + skyNoise(q * 2.3 + 7.1) * 0.3 + skyNoise(q * 5.7 + 3.3) * 0.15;
      col = mix(col, cirrusColor, haze * (0.16 + 0.5 * smoothstep(0.42, 0.78, n)) * smoothstep(0.0, 0.12, dir.y));
    }
    // Ice crystals in the veil make a 22° halo round the sun, with a sharp reddish inner edge and the
    // sky just inside it a shade darker, and sundogs level with the sun either side of it: red towards
    // the sun, with a white tail pointing away
    if (halo > 0.001) {
      float a = acos(clamp(dot(dir, sunDir), -1.0, 1.0));
      col *= 1.0 - 0.06 * halo * smoothstep(0.2, 0.37, a) * (1.0 - smoothstep(0.37, 0.386, a));
      float ring = smoothstep(0.374, 0.386, a) * exp(-max(a - 0.386, 0.0) / 0.022);
      col += mix(vec3(1.0, 0.72, 0.55), vec3(0.95, 0.97, 1.0), smoothstep(0.386, 0.42, a)) * ring * halo * 0.1;
      float dy = asin(clamp(dir.y, -1.0, 1.0)) - asin(clamp(sunDir.y, -1.0, 1.0));
      float da = a - sundogGap;
      float dog = exp(-da * da / 0.00025 - dy * dy / 0.0012) + step(0.0, da) * exp(-da / 0.05 - dy * dy / 0.0003) * 0.3;
      col += mix(vec3(1.0, 0.55, 0.35), vec3(0.9, 0.93, 1.0), smoothstep(-0.01, 0.02, da)) * dog * sundogs * 0.35;
    }
    float m = max(dot(dir, moonDir), 0.0);
    col += vec3(0.5, 0.58, 0.78) * pow(m, 40.0) * 0.22 * moonVis * moonLit;
    // Moon disc shaded as a sphere, lit from the side its phase puts the sun on
    vec3 moonRight = normalize(cross(moonDir, vec3(0.0, 1.0, 0.0)));
    vec3 moonUp = cross(moonRight, moonDir);
    vec2 q = vec2(dot(dir, moonRight), dot(dir, moonUp)) / 0.019;
    float r2 = dot(q, q);
    if (r2 < 1.0 && m > 0.0) {
      vec3 sphere = vec3(q, sqrt(1.0 - r2));
      float lit = smoothstep(-0.08, 0.08, dot(sphere, vec3(sin(moonPhase), 0.0, -cos(moonPhase))));
      vec3 disc = mix(col + vec3(0.03, 0.035, 0.05), vec3(0.93, 0.95, 1.0), lit);
      col = mix(col, disc, smoothstep(1.0, 0.85, r2) * moonVis);
    }
    return col;
  }`;
const skyUniforms = {
  top: { value: new THREE.Color(0x2c3a6e) },
  mid: { value: new THREE.Color(0xd9748a) },
  horizon: { value: HORIZON },
  sunColor: { value: new THREE.Color(0xffb35c) },
  sunDir: { value: SUN_DIR },
  sunVis: { value: 1 },
  moonDir: { value: MOON_DIR },
  moonVis: { value: 0 },
  moonPhase: { value: MOON_START_PHASE },
  moonLit: { value: 1 },
  haze: { value: 0 },
  cirrusColor: { value: new THREE.Color(0xffffff) },
  skyTime: { value: 0 },
  halo: { value: 0 },
  sundogs: { value: 0 },
  sundogGap: { value: 0.384 }
};

// Drifting cloud shadows: a soft noise pattern projected along the sun onto the ground, hills and
// grass (the real clouds are too far off for the sun's shadow box to reach)
const cloudUniforms = { cloudTime: { value: 0 }, cloudShade: { value: 0 }, cloudSun: { value: SUN_DIR } };
const CLOUD_SHADOW_GLSL = `uniform float cloudTime; uniform float cloudShade; uniform vec3 cloudSun;
  float cloudHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float cloudNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(cloudHash(i), cloudHash(i + vec2(1.0, 0.0)), f.x), mix(cloudHash(i + vec2(0.0, 1.0)), cloudHash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float cloudShadow(vec3 world) {
    vec2 p = world.xz - cloudSun.xz / max(cloudSun.y, 0.15) * (40.0 - world.y);
    p = p / 90.0 + vec2(cloudTime * 0.012, cloudTime * 0.004);
    float n = cloudNoise(p) * 0.6 + cloudNoise(p * 2.3) * 0.3 + cloudNoise(p * 5.1) * 0.1;
    return 1.0 - cloudShade * smoothstep(0.5, 0.68, n);
  }`;
function addCloudShadows(material) {
  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, cloudUniforms);
    shader.vertexShader = `varying vec3 vCloudWorld;\n${shader.vertexShader}`.replace(
      "#include <project_vertex>",
      "#include <project_vertex>\n  vCloudWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;"
    );
    shader.fragmentShader = `varying vec3 vCloudWorld;\n${CLOUD_SHADOW_GLSL}\n${shader.fragmentShader}`.replace(
      "#include <tonemapping_fragment>",
      "gl_FragColor.rgb *= cloudShadow(vCloudWorld);\n  #include <tonemapping_fragment>"
    );
  };
}

// Sky dome: horizon, middle band and overhead colours set by the day cycle, plus sun and moon discs.
// It is re-centred on the camera every frame so the horizon stays put when following the eagle.
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: skyUniforms,
    vertexShader: `varying vec3 vDir;
      void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `${SKY_GLSL}
      varying vec3 vDir;
      void main() { gl_FragColor = vec4(skyColor(normalize(vDir)), 1.0); }`
  })
);
// Drawn first, so the mountain shows in front of it even from the far side of the landscape, where the
// mountain is further off than the dome
skyDome.renderOrder = -1;
scene.add(skyDome);

const skyLight = new THREE.HemisphereLight(0xf2c6a8, 0x4a3a40, 0.85);
scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xffa860, 0.9);
sun.position.copy(SUN_DIR).multiplyScalar(100);
scene.add(sun);
// The sun's shadows cover a box this many metres either side of wherever the action is
const SHADOW_REACH = 60;
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_REACH, right: SHADOW_REACH, top: SHADOW_REACH, bottom: -SHADOW_REACH, near: 1, far: 400 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun.target);
const moonLight = new THREE.DirectionalLight(0x9fb2d8, 0);
scene.add(moonLight);

// Meadow, hills, trees and clouds give the eye something to judge distance by
const groundY = -4;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x6f7f48 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
addCloudShadows(ground.material);
scene.add(ground);

const LAKE = { x: 0, z: -20, rx: 20, rz: 10, y: groundY + 0.1 };
const insideLake = (x, z, margin) => ((x - LAKE.x) / (LAKE.rx + margin)) ** 2 + ((z - LAKE.z) / (LAKE.rz + margin)) ** 2 < 1;
function keepOutOfLake(position, margin) {
  const dx = (position.x - LAKE.x) / (LAKE.rx + margin);
  const dz = (position.z - LAKE.z) / (LAKE.rz + margin);
  const reach = Math.hypot(dx, dz);
  if (reach >= 1 || reach === 0) return;
  position.x = LAKE.x + (dx / reach) * (LAKE.rx + margin);
  position.z = LAKE.z + (dz / reach) * (LAKE.rz + margin);
}
function keepOutOfCircle(position, { x, z, radius }) {
  const dx = position.x - x;
  const dz = position.z - z;
  const gap = Math.hypot(dx, dz);
  if (gap >= radius || gap === 0) return;
  position.x = x + (dx / gap) * radius;
  position.z = z + (dz / gap) * radius;
}
// A campsite on the right-hand shore, kept clear of trees, boulders, tall grass and deer
const CAMP = { x: 23, z: -30, radius: 5 };
const nearCamp = (x, z, margin) => Math.hypot(x - CAMP.x, z - CAMP.z) < CAMP.radius + margin;
// A waterfall pours off a rocky bluff straight ahead, beyond the deer meadow, into a pool, and its
// stream winds down through the meadow into the far shore of the lake. The bluff is narrow enough
// to stay clear of the eagle's tour, which only reaches this far back out at the sides.
const BLUFF = { x: -3, z: -117, radius: 21, height: 15 };
const FALLS = { x: -3, z: -96.4, height: 9, width: 2.4 };
const POOL = { x: -3, z: -94.6, radius: 2.8 };
const streamCurve = new THREE.CatmullRomCurve3([
  [-3, -94], [-6, -84], [-1.5, -74], [-5.5, -64], [-2, -54], [-5.5, -45], [-4, -37], [-6.4, -29.6], [-6.8, -27.4]
].map(([x, z]) => new THREE.Vector3(x, 0, z)));
const STREAM_LENGTH = streamCurve.getLength();
// Half the stream's width, `t` of the way down to the lake: it widens as it goes
const streamHalfWidth = t => lerp(0.75, 1.6, t * t);
const STREAM_SAMPLES = streamCurve.getSpacedPoints(120);
function nearStream(x, z, margin) {
  if (x < -10 - margin || x > 3 + margin || z < -98 - margin || z > -26 + margin) return false;
  if (Math.hypot(x - POOL.x, z - POOL.z) < POOL.radius + margin) return true;
  return STREAM_SAMPLES.some((p, i) => Math.hypot(x - p.x, z - p.z) < streamHalfWidth(i / 120) + margin);
}
// Nothing grows in the way of the falls, and nothing stands in front of them
const nearFalls = (x, z, margin) => Math.hypot(x - FALLS.x, z - (FALLS.z + 3)) < 6 + margin;
// The beavers' lodge, a mound of sticks and mud in the shallows beside the stream mouth
const LODGE = { x: -9.6, z: -27.2, radius: 1.6, height: 1.3 };
// Where the campers' canoe rests, pulled up at the water's edge below the camp, and its route round the
// lake: round the open water east of the middle, clear of the heron, the moose and the lake-skimming
// stretch of Look around. The last point is where they line up to come in.
const CANOE_BEACH_ANGLE = 1.82 * Math.PI;
const CANOE_BEACH = new THREE.Vector3(LAKE.x + Math.cos(CANOE_BEACH_ANGLE) * LAKE.rx * 0.97, LAKE.y, LAKE.z + Math.sin(CANOE_BEACH_ANGLE) * LAKE.rz * 0.97);
const CANOE_ROUTE = [[12.5, -27.2], [6.5, -25.5], [4.5, -20], [8, -15], [14, -15.5], [18, -21.5]].map(([x, z]) => new THREE.Vector3(x, LAKE.y, z));

// Soft round sprite texture for mist

// Sunbeam texture: soft edges, strongest near the cloud, fading towards the ground

// Sunbeams slanting down from the clouds while the sun is fairly low and the sky is clear

// Stars that fade in after dusk

for (let i = 0; i < 400; i++) {

// Shooting stars now and then on clear nights; they ride with the stars (and so with the camera).
// Most streak across the lower sky in front of the starting view, where they're in frame. Some nights
// bring a meteor shower, a shooting star every second or so, all streaking away from one point low in
// the sky in front of the starting view.
const METEOR_SECONDS = 0.8;
const METEOR_LENGTH = 120;
const METEOR_TAIL = 35;
const METEOR_RADIUS = 520;
const METEOR_SHOWER_CHANCE = 0.3;
const SHOWER_RADIANT = new THREE.Vector3(Math.sin(Math.PI - 0.3) * Math.cos(0.42), Math.sin(0.42), Math.cos(Math.PI - 0.3) * Math.cos(0.42));
let showerTonight = false;

  const line = new THREE.LineSegments(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
  );
  line.geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));

  line.frustumCulled = false;

});
let meteorTimer = 6;
const meteorAxis = new THREE.Vector3();
function launchMeteor(m) {
  if (showerTonight) {

    do {
      meteorAxis.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).cross(SHOWER_RADIANT).normalize();
      m.from.copy(SHOWER_RADIANT).applyAxisAngle(meteorAxis, 0.12 + Math.random() * 0.5);
    } while (m.from.y < 0.08);
    m.dir.copy(m.from).sub(SHOWER_RADIANT).addScaledVector(m.from, -m.from.dot(m.from.clone().sub(SHOWER_RADIANT))).normalize();
    m.from.multiplyScalar(METEOR_RADIUS);

  } else {

    const azimuth = Math.random() < 0.7 ? Math.PI + (Math.random() - 0.5) * 1.8 : Math.random() * Math.PI * 2;
    const elevation = 0.16 + Math.random() ** 1.5 * 0.38;
    m.from.set(Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation), Math.cos(azimuth) * Math.cos(elevation)).multiplyScalar(METEOR_RADIUS);
    // Streak sideways across the sky and a little downward, shallowly so it isn't lost behind the hills
    m.dir.set(Math.cos(azimuth), 0, -Math.sin(azimuth)).multiplyScalar(Math.random() < 0.5 ? 1 : -1).setY(-0.35).normalize();

    if (free) launchMeteor(free);
    meteorTimer = showerTonight ? 0.3 + Math.random() * 1.3 : 5 + Math.random() * 9;
  }
  for (const m of meteors) {
    if (!m.line.visible) continue;
    m.age += dt;
    const p = m.age / m.seconds;
    const head = METEOR_LENGTH * p;
    const positions = m.line.geometry.attributes.position;
    m.point.copy(m.from).addScaledVector(m.dir, head);
    positions.setXYZ(0, m.point.x, m.point.y, m.point.z);
    m.point.copy(m.from).addScaledVector(m.dir, Math.max(head - METEOR_TAIL, 0));
    positions.setXYZ(1, m.point.x, m.point.y, m.point.z);
    positions.needsUpdate = true;

// Satellites: steady points of light gliding across the sky in the hours after dusk and before dawn,

const SATELLITE_RADIUS = 500;
const satellite = new THREE.Points(
  new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0], 3)),
  new THREE.PointsMaterial({ color: 0xfff4dc, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false })

stars.add(satellite);

function updateSatellite(dt) {
  const s = satellitePass;
  const twilight = sunHeight < -0.08 && sunHeight > -0.45 && weather.overcast < 0.5;
  if (!satellite.visible) {
    s.timer -= dt;
    if (s.timer > 0 || !twilight) return;
    // A great circle from one horizon to the other, passing high but not always overhead
    const heading = Math.random() * Math.PI * 2;
    const tilt = (Math.random() - 0.5) * 1.6;
    s.across.set(Math.cos(heading), 0, Math.sin(heading));
    s.over.set(-Math.sin(heading) * Math.sin(tilt), Math.cos(tilt), Math.cos(heading) * Math.sin(tilt));
    Object.assign(s, { age: 0, seconds: 35 + Math.random() * 20, fadeAt: Math.random() < 0.4 ? 0.45 + Math.random() * 0.3 : 1 });
    satellite.visible = true;
  }
  s.age += dt;

  const angle = lerp(-1.4, 1.4, p);
  satellite.position.copy(s.across).multiplyScalar(Math.sin(angle)).addScaledVector(s.over, Math.cos(angle)).multiplyScalar(SATELLITE_RADIUS);
  const height = satellite.position.y / SATELLITE_RADIUS;

// Airliners crossing high in the sky by day on their way somewhere else, each a glint of sun on a tiny speck
// drawing a white trail behind it, a little way back from the engines. In dry air the trail is short and
// soon gone; in the damp air aloft ahead of rain it lingers, spreading into a broad soft streak, which
// is why the high cloud brings long ones. They ride with the camera, like the stars, and cross low
// enough in front of the starting view to be in frame. At dawn and dusk they glow pink.
const CONTRAIL_RADIUS = 540;

  geo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(CONTRAIL_POINTS * 9), 3));
  geo.setIndex(contrailIndex);
  const trail = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide }));
  trail.frustumCulled = false;

    new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute([0, 0, 0], 3)),
    new THREE.PointsMaterial({ color: 0xfffaf0, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false })
  );
  speck.frustumCulled = false;

});
let jetTimer = 12;

const trailSide = new THREE.Vector3();
const trailColor = new THREE.Color();
function launchJet(jet) {

  jet.over.set(Math.sin(azimuth) * Math.cos(top), Math.sin(top), Math.cos(azimuth) * Math.cos(top));

}
function updateContrails(dt, now) {

  jetTimer -= dt;
  if (jetTimer <= 0) {
    const free = jets.find(jet => !jet.trail.visible);
    if (free && daylight > 0.5) launchJet(free);
    jetTimer = 20 + Math.random() * 25;
  }
  const life = lerp(CONTRAIL_LIFE.dry, CONTRAIL_LIFE.damp, weather.haze);
  const spread = lerp(CONTRAIL_SPREAD.dry, CONTRAIL_SPREAD.damp, weather.haze);
  for (const jet of jets) {
    if (!jet.trail.visible) continue;
    jet.angle += jet.rate * dt;
    jet.trail.position.copy(camera.position);

    const colors = jet.trail.geometry.attributes.color;
    for (let k = 0; k < CONTRAIL_POINTS; k++) {

      trailAlong.copy(jet.across).multiplyScalar(Math.cos(angle)).addScaledVector(jet.over, -Math.sin(angle));
      trailSide.crossVectors(trailPoint, trailAlong).multiplyScalar((1.2 + spread * age) / 2);
      const strength = smoothstep(age, 0.3, 1.2) * Math.exp(-age / life) * smoothstep(trailPoint.y, 0, 0.06) * daylight * 0.75;
      trailPoint.multiplyScalar(CONTRAIL_RADIUS);

      positions.setXYZ(k * 3 + 1, trailPoint.x, trailPoint.y, trailPoint.z);

function updateDucks(dt, now) {

    // Scattered by the floatplane, they paddle off fast for a few seconds

    if (Math.hypot((x - LAKE.x) / LAKE.rx, (z - LAKE.z) / LAKE.rz) > (d.flee ? 0.85 : 0.7)) d.targetHeading = Math.atan2(LAKE.x - x, LAKE.z - z);

// Lily pads in the shallows, some in flower; they bob when a duck paddles past
const padMat = new THREE.MeshLambertMaterial({ color: 0x3f6b35, side: THREE.DoubleSide });
const lilyMat = new THREE.MeshLambertMaterial({ color: 0xf6dbe6 });

      const flower = new THREE.Group();

      const petals = [];
      for (let p = 0; p < LILY_PETALS; p++) {
        const hinge = new THREE.Group();
        hinge.rotation.y = (p / LILY_PETALS) * Math.PI * 2;
        const petal = new THREE.Mesh(petalGeometry, lilyMat);
        petal.position.z = 0.012;
        hinge.add(petal);

      }

      heart.position.y = 0.015;

    }
    lily.position.set(LAKE.x + Math.cos(angle) * reach * LAKE.rx, LAKE.y + 0.015, LAKE.z + Math.sin(angle) * reach * LAKE.rz);
    lily.rotation.y = Math.random() * Math.PI * 2;
    lily.traverse(o => o.layers.set(NOT_REFLECTED));
    Object.assign(lily.userData, { bob: 0, phase: Math.random() * Math.PI * 2, restY: lily.position.y });

// Everything that swims, wades or paddles through the shallows, with how close it comes before it
// rocks a lily pad or startles a frog; each animal adds itself
const lakeVisitors = ducks.map(duck => ({ object: duck, reach: 1.5 }));
const nearVisitor = (position, extra) => lakeVisitors.some(({ object, reach, afloat }) =>
  object.visible && object.position.y > LAKE.y - 1 && (!afloat || afloat())
  && Math.hypot(object.position.x - position.x, object.position.z - position.z) < reach + extra);

function updateLilyPads(dt, now) {
  lilyBloom += ((hour >= 7.5 && hour < 17.5 ? 1 : 0) - lilyBloom) * easeFactor(dt, 0.4);
  for (const lily of lilyPads) {
    const l = lily.userData;
    if (l.petals) for (const { petal, open } of l.petals) petal.rotation.x = lerp(0.12, open, lilyBloom);
    const nudged = nearVisitor(lily.position, 0);
    l.bob = nudged ? Math.min(1, l.bob + dt * 3) : l.bob * Math.exp(-dt * 0.8);
    lily.position.y = l.restY + Math.sin(now * 5 + l.phase) * 0.03 * l.bob;
    lily.rotation.x = Math.sin(now * 4 + l.phase) * 0.08 * l.bob;

// Green frogs sitting out on some of the lily pads, bobbing with them. They croak, mostly after

  frog.rotation.y = Math.random() * Math.PI * 2;

const padPoint = (pad, out) => out.set(pad.position.x, pad.position.y + 0.01, pad.position.z);

  const taken = new Set(frogs.flatMap(other => [other.userData.pad, other.userData.next]));

  let bestGap = FROG_HOP_REACH;
  for (const pad of lilyPads) {
    const gap = flatGap(pad.position, frog.position);
    if (!taken.has(pad) && gap > 0.3 && gap < bestGap && !nearVisitor(pad.position, 0.5)) [best, bestGap] = [pad, gap];

function updateFrogs(dt) {
  const night = sunHeight < 0.02;
  for (const frog of frogs) {
    const f = frog.userData;
    f.time += dt;
    if (f.state === "sit") {
      frogPadPoint(frog, frog.position);
      if (nearVisitor(frog.position, 0.3)) {
        // Away off the far side of the pad into the water
        const away = frog.rotation.y + (Math.random() - 0.5) * 1.2;
        f.from.copy(frog.position);
        f.to.set(frog.position.x + Math.sin(away) * 0.8, LAKE.y, frog.position.z + Math.cos(away) * 0.8);
        frog.rotation.y = away;

      }

      f.hopTimer -= dt;

        f.hopTimer = f.next ? 12 + Math.random() * 25 : 4;

      }

      const p = Math.min(f.time / FROG_HOP_SECONDS, 1);
      padPoint(f.next, f.to);
      frog.position.lerpVectors(f.from, f.to, p);
      frog.position.y += Math.sin(p * Math.PI) * (0.2 + f.from.distanceTo(f.to) * 0.12);

}

// On a calm, clear morning they take the canoe out from the shore below the camp and paddle a
// slow loop of the open water, leaving a wake, and drift back in to land. If the sky starts to
// cloud over they turn for home before the rain comes. They still stop to point at the eagle. On his
// fishing mornings they wait till he's done.
const CANOE_HOURS = { from: 6.5, to: 11 };  // when they set out
const CANOE_HOME_HOUR = 16;                 // and when they head back in, if they haven't already
const CANOE_SPEED = 1.4;

const CANOE_THIGH = -1.55;

// A hull that narrows to a point at each end, with the gunwales sweeping up at bow and stern
const CANOE_LENGTH = 4.6;
const canoeBeam = z => 0.42 * Math.pow(Math.sin(Math.PI * (z / CANOE_LENGTH + 0.5)), 0.6); // half-width at the gunwale

  const along = 28;

  const index = [];
  for (let i = 0; i <= along; i++) {
    const t = i / along;
    const width = canoeBeam((t - 0.5) * CANOE_LENGTH);
    const top = 0.24 + 0.16 * Math.pow(2 * t - 1, 4);
    const bottom = -0.13 * Math.pow(Math.sin(Math.PI * t), 0.4);
    for (let j = 0; j <= around; j++) {

      positions.push(width * Math.cos(angle), top - (top - bottom) * Math.sin(angle), (t - 0.5) * CANOE_LENGTH);
    }
  }
  for (let i = 0; i < along; i++) {
    for (let j = 0; j < around; j++) {
      const a = i * (around + 1) + j;

  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

const canoe = new THREE.Group();

const canoeSeatWorld = new THREE.Vector3();

function updateCanoe(dt, now, night) {

  for (const camper of campers) {
    const c = camper.userData;
    canoe.localToWorld(canoeSeatWorld.copy(CANOE_SEATS[c.seatIndex]));
    c.boatSeat.copy(canoeSeatWorld).setY(canoeSeatWorld.y - SEAT_HEIGHT * camper.scale.y);
    c.boardSpot.copy(canoeSeatWorld).addScaledVector(shoreOut, 1.1).setY(groundY);
  }
  const states = campers.map(camper => camper.userData.state);
  if (t.mode === "beached") {
    // Not on the floatplane's days, when the lake will be busy
    const fine = weather.phase === "clear" && weather.timer > 40 && planeState.mode === "away" && !planeDue();
    const free = states.every(state => !["inTent", "toTent", "toFish", "fishing"].includes(state));
    if (t.day !== day && hour >= CANOE_HOURS.from && hour < CANOE_HOURS.to && fine && free) {
      t.mode = "boarding";
      for (const camper of campers) setCamperState(camper, "toCanoe");
    }
  } else if (t.mode === "boarding") {
    // Called off if either of them is sent elsewhere (the rain coming on, say)
    if (states.some(state => state !== "toCanoe" && state !== "boarding" && state !== "inCanoe")) {
      t.mode = "beached";
      for (const camper of campers) if (camper.userData.state === "boarding") setCamperState(camper, "walk");
    } else if (campers.every(camper => camper.userData.state === "boarding" && camper.userData.sit > 0.95)) {
      for (const camper of campers) setCamperState(camper, "inCanoe");
      Object.assign(t, { mode: "paddling", day, route: CANOE_ROUTE.map(point => point.clone()).concat(CANOE_BEACH.clone()) });
    }
  } else if (t.mode === "paddling") {
    // Turn for home if the weather is on the turn or the day is getting on
    const homeward = weather.phase !== "clear" || hour >= CANOE_HOME_HOUR || night;
    if (homeward && t.route.length > 2) t.route = [CANOE_ROUTE[CANOE_ROUTE.length - 1].clone(), CANOE_BEACH.clone()];
    const next = t.route[0];
    const gap = Math.hypot(next.x - canoe.position.x, next.z - canoe.position.z);
    const last = t.route.length === 1;
    t.heading += turnTowards(t.heading, Math.atan2(next.x - canoe.position.x, next.z - canoe.position.z)) * easeFactor(dt, last ? 1.2 : 0.7);
    // Glide in gently on the last stretch to the shore
    const wanted = last ? Math.min(CANOE_SPEED, gap * 0.45) : CANOE_SPEED;
    t.speed += (wanted - t.speed) * easeFactor(dt, 0.8);

  canoe.position.z += Math.cos(t.heading) * t.speed * dt;

}

}

function updateCamp(dt, now) {
  const bedtime = auroraTonight ? STARGAZE_BEDTIME : CAMP_BEDTIME;
  const night = hour >= bedtime || hour < SUNRISE;
  updateCanoe(dt, now, night);
  // The fire's lit at dusk and burns on through the night
  camp.fire += ((hour >= FIRE_HOUR || hour < SUNRISE ? 1 : 0) - camp.fire) * easeFactor(dt, 0.8);
  // The lamp is only lit after dark, not when they're sheltering from rain by day
  const inside = campers.some(camper => camper.userData.state === "inTent");
  camp.lamp += ((inside && (night || hour >= FIRE_HOUR) ? 1 : 0) - camp.lamp) * easeFactor(dt, 3);
  const scared = bearNearCamp();
  // (He's out before sunrise on his fishing mornings)
  const dawnFishing = camper => hour < SUNRISE && ["toFish", "fishing"].includes(camper.userData.state);
  for (const camper of campers) updateCamper(camper, dt, now, (night && !dawnFishing(camper)) || weather.rain > CAMPER_SHELTER_RAIN || scared);
  updateFishing(dt, now);
  // The day's outings: fishing at first light, her lantern walk to the water at dusk, and lying out
  // to watch the northern lights
  const [him, her] = campers;
  const free = camper => ["stand", "walk", "sit", "toChair"].includes(camper.userData.state);
  const dry = weather.phase === "clear" && weather.rain < 0.05;
  // Lighting the fire calls them over to their chairs
  if (camp.eveningDay !== day && hour >= FIRE_HOUR && hour < CAMP_BEDTIME) {
    camp.eveningDay = day;
    for (const camper of campers) if (["stand", "walk"].includes(camper.userData.state)) setCamperState(camper, "toChair");
  }
  const asleep = him.userData.state === "inTent";
  if (camp.fishDay !== day && hour >= FISHING_HOURS.from && hour < FISHING_HOURS.to && canoeTrip.mode === "beached" && dry && !scared && (asleep || free(him))) {
    camp.fishDay = day;
    if (asleep) leaveTent(him);
    setCamperState(him, "toFish");
  }
  // (On northern-lights nights they're too busy getting ready to lie out and watch)
  if (camp.lanternDay !== day && !auroraTonight && hour >= LANTERN_HOUR && hour < CAMP_BEDTIME - 0.3 && free(her) && dry && !scared) {
    camp.lanternDay = day;
    setCamperState(her, "toShore");
    her.userData.carrying = true;
  }
  if (auroraTonight && hour >= STARGAZE_HOUR && hour < bedtime && dry && !scared) {
    for (const camper of campers) if (free(camper)) setCamperState(camper, "toBlanket");
  }
  lantern.visible = her.userData.carrying && her.visible;
  lanternLight.intensity = lantern.visible ? 0.9 + 0.1 * Math.sin(now * 13) : 0;
  if (lantern.visible) lanternGlass.getWorldPosition(lanternLight.position);

  const burning = camp.fire > 0.01;
  const flicker = 0.85 + 0.15 * Math.sin(now * 21) * Math.sin(now * 8.3 + 1);
  flames.forEach((flame, i) => {
    flame.visible = burning;
    const lick = 1 + 0.22 * Math.sin(now * (9 + i * 2.7) + i * 2) + 0.1 * Math.sin(now * 23 + i * 5);
    const width = camp.fire * (1.1 - 0.1 * lick);

    flame.rotation.z = Math.sin(now * 4.3 + i * 1.7) * 0.15;
  });

  fireGlow.material.opacity = 0.4 * camp.fire * flicker;
  fireGroundGlow.material.opacity = 0.5 * camp.fire * flicker;
  fireLight.intensity = 1.5 * camp.fire * flicker;
  updateSparks(dt);
  tentMat.emissive.copy(LAMP_COLOR).multiplyScalar(0.45 * camp.lamp);
  tentDoorMat.emissive.copy(LAMP_COLOR).multiplyScalar(0.9 * camp.lamp);
  tentGroundGlow.visible = camp.lamp > 0.01;
  tentGroundGlow.material.opacity = 0.3 * camp.lamp;

// Smoke rising from the fire and leaning with the wind, lit warm from below after dark. It lingers a
// while in the morning as the embers smoulder out.
const SMOKE_SECONDS = 7;
const smokeColor = new THREE.Color();
const FIRELIGHT = new THREE.Color(0xff8a3a);
const smoke = Array.from({ length: 16 }, (_, i) => {
  const puff = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, transparent: true, opacity: 0, depthWrite: false }));
  puff.userData.age = (i / 16) * SMOKE_SECONDS;

});
function updateSmoke(dt) {

  camp.smoke += ((burning ? 1 : 0) - camp.smoke) * easeFactor(dt, burning ? 0.6 : 0.15);
  const drift = 0.2 + 0.3 * swayUniforms.wind.value;
  for (const puff of smoke) {
    const s = puff.userData;
    s.age += dt;
    if (s.age > SMOKE_SECONDS) {
      s.age -= SMOKE_SECONDS;
      puff.position.set(FIRE_PIT.x + (Math.random() - 0.5) * 0.2, groundY + 0.6, FIRE_PIT.z + (Math.random() - 0.5) * 0.2);
    }
    const p = s.age / SMOKE_SECONDS;
    puff.position.y += dt * (0.75 - 0.35 * p);
    puff.position.x += dt * drift * Math.min(p * 3, 1);
    puff.position.z += dt * 0.08;
    puff.scale.setScalar(0.35 + p * 2.4);
    puff.visible = camp.smoke > 0.01;
    puff.material.opacity = camp.smoke * 0.3 * smoothstep(p, 0, 0.08) * (1 - p);
    smokeColor.copy(swayUniforms.light.value).multiplyScalar(0.75).lerp(FIRELIGHT, camp.fire * (1 - p) * 0.35);
    puff.material.color.copy(smokeColor);
  }
}

});
function updateChipmunks(dt, now) {
  const out = sunHeight > 0.05 && weather.rain < 0.2 && !bearNearCamp();
  for (const chipmunk of chipmunks) {
    const c = chipmunk.userData;
    chipmunk.visible = out;
    if (!out) continue;
    c.timer -= dt;
    // Anyone walking up sends it scurrying off
    const startled = campers.some(camper => camper.visible && flatGap(camper.position, chipmunk.position) < 1.2);
    if (c.mode === "pause" && (c.timer <= 0 || startled)) {
      pickCampSpot(c.target);
      c.mode = "dash";
    } else if (c.mode === "dash" && headFor(chipmunk, c.target, 2.4, 8, dt, 0.15)) {
      Object.assign(c, { mode: "pause", timer: 1 + Math.random() * 3, sitUp: Math.random() < 0.5 });

// Flat outline in the XY plane (x outward, y forward), laid into a bird's XZ plane

}

    // Leap from one of the fish shapes under the surface
    const leaper = pickShadowFish(0.75);

  jumper.position.y = LAKE.y + Math.sin(p * Math.PI) * JUMP_HEIGHT - 0.05;

  const slope = (JUMP_HEIGHT * Math.PI * Math.cos(p * Math.PI)) / JUMP_LENGTH;

    cycle.shown.position.copy(camera.position);
    cycle.shown.facing.copy(camera.quaternion);
  }
  zoom.current += (zoom.target - zoom.current) * easeFactor(dt, 8);
  const fov = (cycle.on ? cycleFov : lerp(CAMERA_FOV, lookAround.fov, lookAround.weight)) * zoom.current;
  if (fov !== camera.fov) {
    camera.fov = mirrorCamera.fov = fov;
    camera.updateProjectionMatrix();
    mirrorCamera.updateProjectionMatrix();
  }
  camera.updateMatrixWorld();
}

// Keep the sun's shadow box centred where the action is: the lake normally, the eagle when the
// camera travels with it
const SHADOW_HOME = new THREE.Vector3(0, groundY, -25);
const shadowFocus = new THREE.Vector3();
function updateSunShadow() {
  if (cycle.on) shadowFocus.copy(camera.position).setY(groundY);
  else shadowFocus.lerpVectors(SHADOW_HOME, bird.position, Math.max(followBlend, orbit.blend, eyeBlend)).setY(groundY);
  sun.target.position.copy(shadowFocus);
  sun.target.updateMatrixWorld();
  sun.position.copy(shadowFocus).addScaledVector(SUN_DIR, 150);
}

// Mirror the camera in the lake's surface and render what it sees for the water to sample, leaving
// out anything under the water (wading legs, a dunked head, a canoe's hull). The cut sits just
// below the meadow, which is a touch lower than the water, so the far shore still reflects.
const UNDERWATER = [new THREE.Plane(new THREE.Vector3(0, 1, 0), -(groundY - 0.05))];
function renderReflection() {
  mirrorCamera.position.set(camera.position.x, 2 * LAKE.y - camera.position.y, camera.position.z);
  camera.getWorldDirection(mirrorLook);
  mirrorLook.y = -mirrorLook.y;
  mirrorCamera.lookAt(mirrorLook.add(mirrorCamera.position));
  mirrorCamera.updateMatrixWorld();
  mirrorMatrix.copy(MIRROR_BIAS).multiply(mirrorCamera.projectionMatrix).multiply(mirrorCamera.matrixWorldInverse);
  renderer.setRenderTarget(mirrorTarget);
  renderer.clippingPlanes = UNDERWATER;
  renderer.render(scene, mirrorCamera);
  renderer.clippingPlanes = [];
  renderer.setRenderTarget(null);
}

const readout = document.getElementById("readout");
const clockLabel = document.getElementById("clock");
let readoutTimer = 0;

const buttons = document.querySelectorAll(".controls button");
function setDistance(key) {
  targetDistance = DISTANCES[key];
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.distance === key)));
}
buttons.forEach(b => b.addEventListener("click", () => setDistance(b.dataset.distance)));

const followButton = document.getElementById("btn-follow");
const eyeButton = document.getElementById("btn-eye");
const lookButton = document.getElementById("btn-look");
function setFollow(on) {
  const wasTouring = touring();
  follow = on;
  followButton.setAttribute("aria-pressed", String(on));
  if (on) {
    setLookAround(false);
    setCycle(false);
  }
  if (on && !wasTouring) joinTour();
}
function setEagleEye(on) {
  const wasTouring = touring();
  eagleEye = on;
  eyeButton.setAttribute("aria-pressed", String(on));
  if (on) {
    setLookAround(false);
    setCycle(false);
  }
  if (on && !wasTouring) joinTour();
}
eyeButton.addEventListener("click", () => setEagleEye(!eagleEye));
// Looking around leaves the eagle be; starting afresh, it sets off from the vantage behind the tent
function setLookAround(on) {
  if (on && lookAround.progress === 0) {
    Object.assign(lookAround, { u: 0, fresh: true, bank: 0, dragYaw: 0, dragPitch: 0, offsetYaw: 0, offsetPitch: 0 });
    Object.assign(visit, { mode: "none", last: null });
    for (const watcher of Object.values(watchers)) watcher.visited = false;
  }
  lookAround.on = on;
  lookButton.setAttribute("aria-pressed", String(on));
  if (on) {
    setFollow(false);
    setEagleEye(false);
    setCycle(false);
  }
}
lookButton.addEventListener("click", () => setLookAround(!lookAround.on));
const cycleButton = document.getElementById("btn-cycle");
function setCycle(on) {
  if (on === cycle.on) return;
  cycle.on = on;
  cycle.shown.valid = false; // the first flight sets off from the usual view
  cycle.resumeAfter = null;
  // Anything already out when the round starts just takes its turn
  for (const view of CYCLE_VIEWS) if (view.priority) view.absent = view.present() ? 0 : Infinity;
  cycleButton.setAttribute("aria-pressed", String(on));
  viewName.hidden = !on;
  if (on) {
    setFollow(false);
    setEagleEye(false);
    setLookAround(false);
  }
}
// The first press starts at the first view; each one after moves on, and past the last it's back to the usual view
function cycleView() {
  if (!cycle.on) {
    cycle.index = -1;
    setCycle(true);
  }
  nextCycleView();
}
cycleButton.addEventListener("click", cycleView);
// Join the landscape tour at the point nearest the eagle, so it doesn't dash across the map
function joinTour() {
  const probe = new THREE.Vector3();
  const period = (Math.PI * 2) / TOUR_RATE;
  const samples = 240;
  let best = Infinity;
  for (let i = 0; i < samples; i++) {
    const time = (i / samples) * period;
    const gap = tourPoint(time, probe).distanceToSquared(bird.position);
    if (gap < best) {
      best = gap;
      tourTime = time;
    }
  }
}
followButton.addEventListener("click", () => setFollow(!follow));

const soundButton = document.getElementById("btn-sound");
function setSound(on) {
  if (on && !sound.ctx) {
    try {
      startSound();
    } catch {
      soundButton.disabled = true;
      soundButton.title = "This browser can't play generated sound";
      return;
    }
  }
  sound.on = on;
  if (sound.ctx) (on ? sound.ctx.resume() : sound.ctx.suspend()).catch(() => {});
  soundButton.setAttribute("aria-pressed", String(on));
}
soundButton.addEventListener("click", () => setSound(!sound.on));

// Left-drag (or a one-finger drag) orbits the view around the eagle
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  orbit.pointer = e.pointerId;
  orbit.x = e.clientX;
  orbit.y = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== orbit.pointer) return;
  const dx = (e.clientX - orbit.x) * DRAG_RADIANS_PER_PIXEL;
  const dy = (e.clientY - orbit.y) * DRAG_RADIANS_PER_PIXEL;
  orbit.x = e.clientX;
  orbit.y = e.clientY;
  // Looking around, this turns the head; following, it swings the chase camera round; riding
  // along, it looks around
  if (cycle.on) {
    cycle.dragYaw -= dx;
    cycle.dragPitch = clamp(cycle.dragPitch - dy, -1, 1);
    return;
  }
  if (lookAround.on) {
    lookAround.dragYaw -= dx;
    lookAround.dragPitch = clamp(lookAround.dragPitch - dy, -1, 1);
    return;
  }
  if (touring()) {
    orbit.followYaw -= dx;
    orbit.followPitch = clamp(orbit.followPitch + dy, ORBIT_PITCH_LIMITS[0] - FOLLOW_PITCH, ORBIT_PITCH_LIMITS[1] - FOLLOW_PITCH);
    return;
  }
  if (!orbit.free) {
    // Start from wherever the camera is now, so the view doesn't jump
    const toCamera = camera.position.clone().sub(bird.position);
    orbit.yaw = Math.atan2(toCamera.x, toCamera.z);
    orbit.pitch = Math.asin(clamp(toCamera.y / Math.max(toCamera.length(), 1e-3), -1, 1));
    orbit.free = true;
  }
  orbit.yaw -= dx;
  orbit.pitch = clamp(orbit.pitch + dy, ...ORBIT_PITCH_LIMITS);
});
function endDrag(e) {
  if (e.pointerId !== orbit.pointer) return;
  orbit.pointer = null;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
function resetView() {
  orbit.free = false;
  orbit.followYaw = 0;
  orbit.followPitch = 0;
  lookAround.dragYaw = 0;
  lookAround.dragPitch = 0;
  cycle.dragYaw = 0;
  cycle.dragPitch = 0;
  zoom.target = 1;
}
canvas.addEventListener("dblclick", resetView);
// R goes further: out of whichever mode it's in, back to the view from the front of the lake
function viewFromFront() {
  setFollow(false);
  setEagleEye(false);
  setLookAround(false);
  setCycle(false);
  resetView();
}
// Scrolling up zooms in, down zooms out (a trackpad pinch arrives as a scroll too)
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const pixels = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1);
  zoom.target = clamp(zoom.target * Math.exp(pixels * ZOOM_PER_PIXEL), ...ZOOM_LIMITS);
}, { passive: false });

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const distanceKey = { "1": "close", "2": "away", "3": "far" }[key];
  if (distanceKey) setDistance(distanceKey);
  else if (key === "f") setFollow(!follow);
  else if (key === "e") setEagleEye(!eagleEye);
  else if (key === "l") setLookAround(!lookAround.on);
  else if (key === "c") cycleView();
  else if (key === "m") setSound(!sound.on);
  else if (key === "r") viewFromFront();
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  Object.assign(mirrorCamera, { fov: camera.fov, aspect: camera.aspect, near: camera.near, far: camera.far });
  mirrorCamera.updateProjectionMatrix();
  const pixelRatio = renderer.getPixelRatio();
  mirrorTarget.setSize(Math.round((innerWidth * pixelRatio) / 2), Math.round((innerHeight * pixelRatio) / 2));
  fireflyMat.uniforms.scale.value = 60 * pixelRatio;
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05) * motionScale;
  elapsed += dt;

  const lastHour = hour;
  hour = (hour + dt * (hour < 5 || hour >= fastNightFrom() ? NIGHT_HOURS_PER_SECOND : DAY_HOURS_PER_SECOND)) % 24;
  // The moon moves on a phase each day (at noon, while it's down). The night ahead is settled at
  // noon too, so the bear and the campers can plan round it: the first night and about half of the
  // rest bring the northern lights, and some bring the wolves.
  if (lastHour < 12 && hour >= 12) {
    moonPhase = MOON_START_PHASE + (++day * Math.PI * 2) / LUNAR_NIGHTS;
    auroraTonight = day === 1 || Math.random() < AURORA_CHANCE;
    showerTonight = Math.random() < METEOR_SHOWER_CHANCE;
    raccoonState.tonight = Math.random() < RACCOON_CHANCE;
    // The bear's evening: fishing the stream, or the berries and the camp
    bearState.campVisit = !auroraTonight && Math.random() < BEAR_CAMP_CHANCE;
    // The floatplane, some afternoons (always the first)
    planeState.hour = lerp(PLANE_HOURS.from, 13, Math.random());
    // The balloon, some mornings (always the first)
    balloonState.tomorrow = Math.random() < BALLOON_CHANCE;
    wolves.tonight = Math.random() < WOLF_CHANCE;
  }
  if (lastHour < SUNSET && hour >= SUNSET) nightsSeen++;
  updateWeather(dt);
  updateDayCycle();

  const pose = updateFlightPath(dt);
  velocity.subVectors(current, previous);
  previous.copy(current);
  if (eagle.mode === "perched") heading.lerp(eagle.roost.facing, easeFactor(dt, 3)).normalize();
  else if (velocity.lengthSq() > 1e-10) heading.lerp(velocity.normalize(), easeFactor(dt, 6)).normalize();

  // Bank into turns, based on how fast the heading swings left or right
  const yawRate = (lastHeading.z * heading.x - lastHeading.x * heading.z) / Math.max(dt, 1e-3);
  lastHeading.copy(heading);
  roll += (clamp(-yawRate * 0.6, -0.8, 0.8) * (1 - pose.fold) - roll) * easeFactor(dt, 4);

  // Slow, deep wingbeats between long soaring stretches with upturned tips; folded when perched
  const cruiseGlide = smoothstep(Math.sin(flightTime * 0.35), -0.1, 0.3);
  const glide = pose.glide === null ? cruiseGlide : lerp(cruiseGlide, pose.glide, eagle.weight);
  const spread = 1 - pose.fold;
  const amplitude = lerp(0.5, 0.03, glide) * spread;
  flapPhase += dt * lerp(6, 1.5, glide);
  for (const { shoulder, wrist, side } of bird.userData.wings) {
    shoulder.rotation.z = side * (Math.sin(flapPhase) * amplitude + 0.06 - 0.12 * pose.fold);
    shoulder.rotation.y = side * 1.35 * pose.fold;
    shoulder.scale.x = 1 - 0.45 * pose.fold;
    wrist.rotation.z = side * (Math.sin(flapPhase - 0.7) * amplitude * 0.5 + 0.1 * spread);
  }
  for (const foot of bird.userData.feet) foot.rotation.x = lerp(-Math.PI / 2, -1.15 * Math.PI, pose.talons);
  bird.userData.head.rotation.x = pose.eat * (0.9 + 0.35 * Math.max(Math.sin(elapsed * 7), 0));
  if (fish.visible) fish.rotation.y = Math.sin(elapsed * 20) * 0.3 * (1 - pose.eat);

  bird.position.copy(current);
  bird.position.y -= Math.sin(flapPhase) * 0.04 * (1 - glide) * spread;
  bird.lookAt(lookTarget.copy(bird.position).add(heading));
  bird.rotateZ(roll);
  bird.rotateX(-0.6 * pose.fold); // sit upright on the branch

  updateNest(dt, elapsed, pose);
  checkHerdAlarm(dt);
  for (const cloud of clouds) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 160) cloud.position.x = -160;
  }
  for (const flock of flocks) {
    flock.position.x += flock.userData.dir * flock.userData.speed * dt;
    if (flock.position.x * flock.userData.dir > FLOCK_EDGE) launchFlock(flock, false);
    for (const farBird of flock.children) {
      for (const { wing, side } of farBird.userData.wings) wing.rotation.z = side * Math.sin(elapsed * 7 + farBird.userData.offset) * 0.6;
    }
  }
  updateFox(dt, elapsed);
  for (const deer of herd) updateDeer(deer, dt, elapsed);
  updateDucks(dt, elapsed);
  updateLilyPads(dt, elapsed);
  updateFrogs(dt);
  updateDragonflies(dt, elapsed);
  updateButterflies(dt, elapsed);
  updateWeb(elapsed);
  updateFishShadows(dt, elapsed);
  updateJumper(dt);
  updateSplashes(dt);
  updateBats(elapsed);
  updateOwl(dt, elapsed);
  updateHeron(dt, elapsed);
  updateMoose(dt, elapsed);
  updateLoon(dt, elapsed);
  updateCamp(dt, elapsed);
  updateFalls(dt, elapsed);
  updateSprayRainbow(dt);
  updateBeavers(dt, elapsed);
  updateTurtles(dt, elapsed);
  updateOtters(dt, elapsed);
  updateKingfisher(dt, elapsed);
  updateOsprey(dt, elapsed);
  updateFloatplane(dt, elapsed);
  updateBalloon(dt, elapsed);
  updateKettle(dt, elapsed);
  updateHawk(dt, elapsed);
  updateBear(dt, elapsed);
  updateSmoke(dt);
  updateChipmunks(dt, elapsed);
  updateHummingbird(dt, elapsed);
  updateRaccoon(dt, elapsed);
  updateWoodpecker(dt, elapsed);
  updateWolves(dt);
  const treeWind = swayUniforms.wind.value;
  for (const tree of trees) {
    const { phase } = tree.userData;
    tree.rotation.z = Math.sin(elapsed * 1.1 + phase) * TREE_SWAY * treeWind;
    tree.rotation.x = Math.sin(elapsed * 0.8 + phase * 1.3) * TREE_SWAY * 0.6 * treeWind;
  }

  updateCamera(dt);
  updateSunShadow();
  skyDome.position.copy(camera.position);
  stars.position.copy(camera.position);
  aurora.position.set(camera.position.x, camera.position.y + 130, camera.position.z);
  updateShootingStars(dt);
  updateSatellite(dt);
  updateContrails(dt, elapsed);
  updateRain(dt);
  updateBeams(beamAmount, dayColors.sun);
  updateMist(dt, mistAmount, mistColor);
  swayUniforms.time.value = elapsed;
  fireflyMat.uniforms.time.value = elapsed;
  waterUniforms.time.value = elapsed;
  aurora.material.uniforms.time.value = elapsed;
  cloudUniforms.cloudTime.value = elapsed;
  skyUniforms.skyTime.value = elapsed;
  updateSound(dt, elapsed);

  readoutTimer -= dt;
  if (readoutTimer <= 0) {
    readout.textContent = bird.position.distanceTo(camera.position).toFixed(1);
    const pad = n => String(Math.floor(n)).padStart(2, "0");
    const northernLights = aurora.visible && aurora.material.uniforms.opacity.value > 0.3 ? "Northern lights behind you" : "";
    const meteorShower = showerTonight && stars.material.opacity > 0.5 ? "Meteor shower" : "";
    clockLabel.textContent = [`${pad(hour)}:${pad((hour % 1) * 60)}`, dayPart(hour), weatherLabel(), northernLights, meteorShower].filter(Boolean).join(" · ");
    readoutTimer = 0.1;
  }

  renderer.shadowMap.needsUpdate = true;
  renderReflection();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
