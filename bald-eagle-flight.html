<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body { margin: 0; }</style>
<title>Bald Eagle Flight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Young+Serif&display=swap">
<style>
/* Layout: full-bleed landscape canvas, name card top-left, toggles and distance switch docked bottom-centre */
:root {
  --sky-top: #2c3a6e;
  --sky-horizon: #f2a46a;
  --ink: #16243f;
  --ink-soft: #4a5a78;
  --on-ink: #f6f8fc;
  --glass: rgba(248, 251, 255, 0.8);
  --glass-strong: rgba(255, 255, 255, 0.94);
  --glass-edge: rgba(22, 36, 63, 0.14);
  --accent: #e8b021; /* the eagle's yellow beak */
  --on-accent: #2a1a05;
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-ui: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky-horizon);
  color: var(--ink);
  font-family: var(--font-ui);
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene.dragging { cursor: grabbing; }

.card {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  display: grid;
  gap: 4px;
  padding: 12px 16px 14px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  max-width: calc(100% - 32px);
}
.eyebrow {
  margin: 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.eyebrow i { font-weight: 400; text-transform: none; letter-spacing: 0.02em; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 26px;
  line-height: 1.1;
  text-wrap: balance;
}
.readout {
  margin: 4px 0 0;
  font-size: 14px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.readout strong { color: var(--ink); font-weight: 700; font-size: 18px; }
.hint { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); }
.hint-touch { display: none; }
@media (hover: none) {
  .hint-mouse { display: none; }
  .hint-touch { display: inline; }
}

.dock {
  position: fixed;
  left: 50%;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.toggles { display: flex; gap: 8px; }
.toggle,
.controls {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 999px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(22, 36, 63, 0.16);
}
.controls { display: flex; gap: 4px; padding: 5px; }
.dock button {
  appearance: none;
  margin: 0;
  color: var(--ink);
  font: 600 15px/1 var(--font-ui);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
}
.controls button { border: 0; padding: 11px 20px; border-radius: 999px; background: transparent; }
.controls button:hover { background: rgba(22, 36, 63, 0.08); }
.controls button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.dock .toggle { padding: 9px 16px; font-size: 14px; }
.dock .toggle:hover { background: var(--glass-strong); }
.dock .toggle[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.dock button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.dock kbd {
  font: 400 11px/1 var(--font-ui);
  opacity: 0.55;
  margin-left: 6px;
}
@media (max-width: 420px) {
  .controls button { padding: 11px 15px; }
  .dock kbd { display: none; }
}
@media (hover: none) { .dock kbd { display: none; } }
</style>

<canvas id="scene" aria-label="An American bald eagle over a lake through a looping day: it snatches fish and eats them on a dead tree, while deer graze, a fox and a heron hunt, ducks paddle, two campers by their tent point up as the eagle passes overhead, shelter from the rain and turn in by firelight at night, bats and an owl come out at night (the eagle buzzes the fox and chases the owl) and the weather turns from sunshine to thunderstorms"></canvas>

<div class="card">
  <p class="eyebrow">American bald eagle · <i>Haliaeetus leucocephalus</i></p>
  <h1>Bald Eagle Flight</h1>
  <p class="readout"><strong id="readout">9.0</strong> m from camera</p>
  <p class="readout" id="clock">05:36 · Dawn</p>
  <p class="hint"><span class="hint-mouse">Drag to look around the eagle. Double-click or press R to reset.</span><span class="hint-touch">Drag to look around the eagle. Double-tap to reset.</span></p>
</div>

<div class="dock">
  <div class="toggles">
    <button type="button" id="btn-follow" class="toggle" aria-pressed="false">Follow eagle<kbd>F</kbd></button>
    <button type="button" id="btn-eye" class="toggle" aria-pressed="false">Eagle’s-eye<kbd>E</kbd></button>
    <button type="button" id="btn-sound" class="toggle" aria-pressed="false">Sound<kbd>M</kbd></button>
  </div>
  <div class="controls" role="group" aria-label="Distance between the eagle and the camera">
    <button type="button" id="btn-close" data-distance="close" aria-pressed="false">Close<kbd>1</kbd></button>
    <button type="button" id="btn-away" data-distance="away" aria-pressed="true">Away<kbd>2</kbd></button>
    <button type="button" id="btn-far" data-distance="far" aria-pressed="false">Far away<kbd>3</kbd></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const DISTANCES = { close: 3.2, away: 9, far: 30 };
const HORIZON = new THREE.Color(0xf7a35c);
// Directions to the sun and moon, moved across the sky by the day cycle
const SUN_DIR = new THREE.Vector3(-0.05, 0.12, -1).normalize();
const MOON_DIR = new THREE.Vector3(0.05, -0.12, -1).normalize();
// Layer for the water surface and its effects, which the reflection camera must not see
const NOT_REFLECTED = 1;
// Moon phase as the angle of sunlight across it: 0 is new, π is full; it starts waxing gibbous
const MOON_START_PHASE = 2.4;
const LUNAR_NIGHTS = 8; // a full cycle of phases takes this many days
const motionScale = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.5 : 1;
const { smoothstep, lerp, clamp } = THREE.MathUtils;
// Fraction of the remaining gap to close this frame, for frame-rate independent easing
const easeFactor = (dt, rate) => 1 - Math.exp(-dt * rate);
const turnTowards = (from, to) => Math.atan2(Math.sin(to - from), Math.cos(to - from));
// Let every solid mesh in a group cast shadows (see-through bits such as duck wakes don't)
const castShadows = object => object.traverse(o => {
  if (o.isMesh && !o.material.transparent) o.castShadow = true;
});

// Small seeded random so the scenery is the same on every load
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(7);

const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// Shadows are drawn once per frame and shared by the reflection and main renders
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe39a72, 45, 420);

const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 1200);
camera.layers.enable(NOT_REFLECTED);
const HOME_POSITION = new THREE.Vector3(0, 0, 0);
const HOME_TARGET = new THREE.Vector3(0, 0.3, -10);
camera.position.copy(HOME_POSITION);
camera.lookAt(HOME_TARGET);

// Sky colour for a view direction, shared by the sky dome and the lake
const SKY_GLSL = `uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; uniform vec3 sunColor; uniform vec3 sunDir;
  uniform float sunVis; uniform vec3 moonDir; uniform float moonVis; uniform float moonPhase; uniform float moonLit;
  vec3 skyColor(vec3 dir) {
    vec3 col = mix(horizon, mid, smoothstep(0.02, 0.22, dir.y));
    col = mix(col, top, smoothstep(0.18, 0.65, dir.y));
    float s = max(dot(dir, sunDir), 0.0);
    col += sunColor * (pow(s, 6.0) * 0.35 + pow(s, 80.0) * 0.6);
    col = mix(col, vec3(1.0, 0.93, 0.75), smoothstep(0.9992, 0.9995, s) * sunVis);
    float m = max(dot(dir, moonDir), 0.0);
    col += vec3(0.5, 0.58, 0.78) * pow(m, 40.0) * 0.22 * moonVis * moonLit;
    // Moon disc shaded as a sphere, lit from the side its phase puts the sun on
    vec3 moonRight = normalize(cross(moonDir, vec3(0.0, 1.0, 0.0)));
    vec3 moonUp = cross(moonRight, moonDir);
    vec2 q = vec2(dot(dir, moonRight), dot(dir, moonUp)) / 0.019;
    float r2 = dot(q, q);
    if (r2 < 1.0 && m > 0.0) {
      vec3 sphere = vec3(q, sqrt(1.0 - r2));
      float lit = smoothstep(-0.08, 0.08, dot(sphere, vec3(sin(moonPhase), 0.0, -cos(moonPhase))));
      vec3 disc = mix(col + vec3(0.03, 0.035, 0.05), vec3(0.93, 0.95, 1.0), lit);
      col = mix(col, disc, smoothstep(1.0, 0.85, r2) * moonVis);
    }
    return col;
  }`;
const skyUniforms = {
  top: { value: new THREE.Color(0x2c3a6e) },
  mid: { value: new THREE.Color(0xd9748a) },
  horizon: { value: HORIZON },
  sunColor: { value: new THREE.Color(0xffb35c) },
  sunDir: { value: SUN_DIR },
  sunVis: { value: 1 },
  moonDir: { value: MOON_DIR },
  moonVis: { value: 0 },
  moonPhase: { value: MOON_START_PHASE },
  moonLit: { value: 1 }
};

// Drifting cloud shadows: a soft noise pattern projected along the sun onto the ground, hills and
// grass (the real clouds are too far off for the sun's shadow box to reach)
const cloudUniforms = { cloudTime: { value: 0 }, cloudShade: { value: 0 }, cloudSun: { value: SUN_DIR } };
const CLOUD_SHADOW_GLSL = `uniform float cloudTime; uniform float cloudShade; uniform vec3 cloudSun;
  float cloudHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float cloudNoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(cloudHash(i), cloudHash(i + vec2(1.0, 0.0)), f.x), mix(cloudHash(i + vec2(0.0, 1.0)), cloudHash(i + vec2(1.0, 1.0)), f.x), f.y);
  }
  float cloudShadow(vec3 world) {
    vec2 p = world.xz - cloudSun.xz / max(cloudSun.y, 0.15) * (40.0 - world.y);
    p = p / 90.0 + vec2(cloudTime * 0.012, cloudTime * 0.004);
    float n = cloudNoise(p) * 0.6 + cloudNoise(p * 2.3) * 0.3 + cloudNoise(p * 5.1) * 0.1;
    return 1.0 - cloudShade * smoothstep(0.5, 0.68, n);
  }`;
function addCloudShadows(material) {
  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, cloudUniforms);
    shader.vertexShader = `varying vec3 vCloudWorld;\n${shader.vertexShader}`.replace(
      "#include <project_vertex>",
      "#include <project_vertex>\n  vCloudWorld = (modelMatrix * vec4(transformed, 1.0)).xyz;"
    );
    shader.fragmentShader = `varying vec3 vCloudWorld;\n${CLOUD_SHADOW_GLSL}\n${shader.fragmentShader}`.replace(
      "#include <tonemapping_fragment>",
      "gl_FragColor.rgb *= cloudShadow(vCloudWorld);\n  #include <tonemapping_fragment>"
    );
  };
}

// Sky dome: horizon, middle band and overhead colours set by the day cycle, plus sun and moon discs.
// It is re-centred on the camera every frame so the horizon stays put when following the eagle.
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(600, 48, 24),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: skyUniforms,
    vertexShader: `varying vec3 vDir;
      void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `${SKY_GLSL}
      varying vec3 vDir;
      void main() { gl_FragColor = vec4(skyColor(normalize(vDir)), 1.0); }`
  })
);
scene.add(skyDome);

const skyLight = new THREE.HemisphereLight(0xf2c6a8, 0x4a3a40, 0.85);
scene.add(skyLight);
const sun = new THREE.DirectionalLight(0xffa860, 0.9);
sun.position.copy(SUN_DIR).multiplyScalar(100);
scene.add(sun);
// The sun's shadows cover a box this many metres either side of wherever the action is
const SHADOW_REACH = 60;
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -SHADOW_REACH, right: SHADOW_REACH, top: SHADOW_REACH, bottom: -SHADOW_REACH, near: 1, far: 400 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.04;
scene.add(sun.target);
const moonLight = new THREE.DirectionalLight(0x9fb2d8, 0);
scene.add(moonLight);

// Meadow, hills, trees and clouds give the eye something to judge distance by
const groundY = -4;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshLambertMaterial({ color: 0x6f7f48 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
addCloudShadows(ground.material);
scene.add(ground);

const LAKE = { x: 0, z: -20, rx: 20, rz: 10, y: groundY + 0.1 };
const insideLake = (x, z, margin) => ((x - LAKE.x) / (LAKE.rx + margin)) ** 2 + ((z - LAKE.z) / (LAKE.rz + margin)) ** 2 < 1;
function keepOutOfLake(position, margin) {
  const dx = (position.x - LAKE.x) / (LAKE.rx + margin);
  const dz = (position.z - LAKE.z) / (LAKE.rz + margin);
  const reach = Math.hypot(dx, dz);
  if (reach >= 1 || reach === 0) return;
  position.x = LAKE.x + (dx / reach) * (LAKE.rx + margin);
  position.z = LAKE.z + (dz / reach) * (LAKE.rz + margin);
}
function keepOutOfCircle(position, { x, z, radius }) {
  const dx = position.x - x;
  const dz = position.z - z;
  const gap = Math.hypot(dx, dz);
  if (gap >= radius || gap === 0) return;
  position.x = x + (dx / gap) * radius;
  position.z = z + (dz / gap) * radius;
}
// A campsite on the right-hand shore, kept clear of trees, boulders, tall grass and deer
const CAMP = { x: 23, z: -30, radius: 5 };
const nearCamp = (x, z, margin) => Math.hypot(x - CAMP.x, z - CAMP.z) < CAMP.radius + margin;

// Lake reflections: each frame a mirror camera below the surface renders the scene into a texture
const mirrorTarget = new THREE.WebGLRenderTarget(512, 512);
const mirrorCamera = new THREE.PerspectiveCamera();
const mirrorMatrix = new THREE.Matrix4();
const mirrorLook = new THREE.Vector3();
// Maps clip space (-1…1) to texture space (0…1)
const MIRROR_BIAS = new THREE.Matrix4().set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1);

// Lake in the foreground: mirror reflections broken up by moving ripples, raindrop rings and
// glints of sun and moon
const shore = new THREE.Mesh(new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x8a7550 }));
shore.scale.set(LAKE.rx + 1.5, 1, LAKE.rz + 1.2);
shore.position.set(LAKE.x, groundY + 0.05, LAKE.z);
const waterUniforms = {
  ...skyUniforms,
  time: { value: 0 },
  rain: { value: 0 },
  deep: { value: new THREE.Color(0x1f2a44) },
  mirror: { value: mirrorTarget.texture },
  mirrorMatrix: { value: mirrorMatrix }
};
const water = new THREE.Mesh(
  new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2),
  new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    vertexShader: `uniform mat4 mirrorMatrix; varying vec3 vWorld; varying vec4 vMirror;
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0);
        vWorld = w.xyz;
        vMirror = mirrorMatrix * w;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: `${SKY_GLSL}
      uniform float time; uniform float rain; uniform vec3 deep; uniform sampler2D mirror;
      varying vec3 vWorld; varying vec4 vMirror;
      // One expanding ring per grid cell, each starting at its own moment
      float raindrops(vec2 p) {
        vec2 cell = floor(p);
        float h = fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453);
        vec2 centre = cell + 0.5 + (vec2(fract(h * 7.31), fract(h * 3.17)) - 0.5) * 0.6;
        float t = fract(time * 0.9 + h);
        return smoothstep(0.05, 0.0, abs(length(p - centre) - t * 0.45)) * (1.0 - t);
      }
      void main() {
        vec3 view = normalize(vWorld - cameraPosition);
        vec2 p = vWorld.xz;
        vec3 n = normalize(vec3(
          sin(p.x * 1.7 + time * 1.3) * 0.025 + sin(p.y * 3.1 - p.x * 0.7 + time * 2.1) * 0.02,
          1.0,
          sin(p.y * 2.3 - time * 1.1) * 0.03 + cos(p.x * 2.9 + p.y * 1.3 + time * 1.7) * 0.02));
        float drops = (raindrops(p * 1.6) + raindrops(p * 1.6 + 17.3)) * rain;
        n = normalize(n + vec3(drops * 0.15, 0.0, drops * 0.15));
        vec3 reflected = texture2D(mirror, vMirror.xy / vMirror.w + n.xz * 0.05).rgb;
        vec3 r = reflect(view, n);
        float fresnel = 0.3 + 0.7 * pow(1.0 - max(dot(-view, n), 0.0), 4.0);
        vec3 col = mix(deep, reflected, fresnel);
        col += sunColor * pow(max(dot(r, sunDir), 0.0), 400.0) * 1.5 * sunVis;
        col += vec3(0.85, 0.9, 1.0) * pow(max(dot(r, moonDir), 0.0), 250.0) * 1.2 * moonVis * moonLit;
        gl_FragColor = vec4(col + drops * 0.25, 1.0);
      }`
  })
);
water.scale.set(LAKE.rx, 1, LAKE.rz);
water.position.set(LAKE.x, LAKE.y, LAKE.z);
water.layers.set(NOT_REFLECTED);
shore.receiveShadow = true;
scene.add(shore, water);
// The water's shader doesn't take shadows, so a shadow-only layer just above it catches them
const lakeShadow = new THREE.Mesh(new THREE.CircleGeometry(1, 64).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.35 }));
lakeShadow.scale.set(LAKE.rx, 1, LAKE.rz);
lakeShadow.position.set(LAKE.x, LAKE.y + 0.02, LAKE.z);
lakeShadow.receiveShadow = true;
lakeShadow.layers.set(NOT_REFLECTED);
scene.add(lakeShadow);

// Far hills; the day cycle darkens them to silhouettes against sunrise and sunset.
// The first five are in front, where the sun rises and sets; the rest ring the sides and back.
const hillMat = new THREE.MeshLambertMaterial({ color: 0x5a4a5e });
const HILLS = [
  [-90, -170, 60], [40, -200, 80], [160, -160, 55], [-210, -230, 90], [10, -280, 110],
  [260, -40, 70], [230, 90, 85], [120, 220, 95], [-30, 260, 110], [-170, 200, 90], [-260, 60, 80], [-250, -70, 65]
];
HILLS.forEach(([x, z, r]) => {
  const hill = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), hillMat);
  hill.scale.y = 0.35;
  hill.position.set(x, groundY, z);
  scene.add(hill);
});
addCloudShadows(hillMat);

const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2f });
const leafMat = new THREE.MeshLambertMaterial({ color: 0x3a5a36 });
// Every tree, so they can all sway in the wind
const trees = [];
const TREE_SWAY = 0.012; // radians of lean in a normal breeze
function addTree(x, z, h) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, h * 0.3, 6), trunkMat);
  trunk.position.y = h * 0.15;
  const crown = new THREE.Mesh(new THREE.ConeGeometry(h * 0.28, h * 0.8, 7), leafMat);
  crown.position.y = h * 0.7;
  crown.receiveShadow = true;
  tree.add(trunk, crown);
  tree.position.set(x, groundY, z);
  tree.userData.phase = Math.random() * Math.PI * 2;
  castShadows(tree);
  trees.push(tree);
  scene.add(tree);
}
// The trees in front of the starting view
const FRONT_TREES = { xMax: 75, zMax: -8 };
for (let i = 0; i < 45; i++) {
  let x, z;
  do {
    z = FRONT_TREES.zMax - rand() * 120;
    x = (rand() < 0.5 ? -1 : 1) * (5 + rand() * (FRONT_TREES.xMax - 5));
  } while (insideLake(x, z, 4));
  // Draw the height even for a tree left out of the campsite, so the rest of the scenery is unchanged
  const h = 3 + rand() * 4;
  if (!nearCamp(x, z, 2)) addTree(x, z, h);
}

// A dead snag on the far-left shore, where the eagle lands to eat its catch
const SNAG = { x: -14, z: -33, perchHeight: 5.2 };
const barkMat = new THREE.MeshLambertMaterial({ color: 0x7d736a });
const snag = new THREE.Group();
snag.add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.35, 7, 7).translate(0, 3.5, 0), barkMat));
// [height, length, yaw, tilt from vertical]; the first is the long bare perch branch
[[SNAG.perchHeight, 1.9, 0, Math.PI / 2], [3.6, 1.6, 2.2, 1.0], [4.6, 1.3, 4.0, 0.8], [6.1, 1.0, 1.2, 0.6], [2.8, 1.1, 5.2, 1.2]].forEach(([height, length, yaw, tilt]) => {

// Soft round sprite texture for mist
function softTexture() {
  const size = 128;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const glow = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  glow.addColorStop(0, "rgba(255,255,255,1)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = glow;
  g.fillRect(0, 0, size, size);

}

// Sunbeam texture: soft edges, strongest near the cloud, fading towards the ground
function beamTexture() {
  const c = document.createElement("canvas");
  c.width = 64;
  c.height = 256;
  const g = c.getContext("2d");
  const across = g.createLinearGradient(0, 0, 64, 0);
  across.addColorStop(0, "rgba(255,255,255,0)");
  across.addColorStop(0.5, "rgba(255,255,255,1)");
  across.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = across;
  g.fillRect(0, 0, 64, 256);
  const along = g.createLinearGradient(0, 0, 0, 256);
  along.addColorStop(0, "rgba(0,0,0,0)");
  along.addColorStop(0.7, "rgba(0,0,0,1)");
  along.addColorStop(1, "rgba(0,0,0,0)");
  g.globalCompositeOperation = "destination-in";
  g.fillStyle = along;
  g.fillRect(0, 0, 64, 256);
  return new THREE.CanvasTexture(c);
}

const METEOR_SECONDS = 0.8;
const METEOR_LENGTH = 120;
const METEOR_TAIL = 35;
const METEOR_RADIUS = 520;
const shootingStar = new THREE.LineSegments(
  new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })
);
shootingStar.geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));

const meteor = { timer: 6, age: 0, from: new THREE.Vector3(), dir: new THREE.Vector3(), point: new THREE.Vector3() };
function updateShootingStar(dt) {
  const night = stars.material.opacity;
  if (!shootingStar.visible) {
    meteor.timer -= dt;
    if (meteor.timer > 0 || night < 0.5) return;
    const azimuth = Math.random() * Math.PI * 2;
    const elevation = 0.45 + Math.random() * 0.5;
    meteor.from.set(Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation), Math.cos(azimuth) * Math.cos(elevation)).multiplyScalar(METEOR_RADIUS);
    // Streak sideways across the sky and a little downward
    meteor.dir.set(Math.cos(azimuth), 0, -Math.sin(azimuth)).multiplyScalar(Math.random() < 0.5 ? 1 : -1).setY(-0.6).normalize();
    meteor.age = 0;
    shootingStar.visible = true;
  }
  meteor.age += dt;
  const p = meteor.age / METEOR_SECONDS;
  const head = METEOR_LENGTH * p;
  const positions = shootingStar.geometry.attributes.position;
  meteor.point.copy(meteor.from).addScaledVector(meteor.dir, head);
  positions.setXYZ(0, meteor.point.x, meteor.point.y, meteor.point.z);
  meteor.point.copy(meteor.from).addScaledVector(meteor.dir, Math.max(head - METEOR_TAIL, 0));
  positions.setXYZ(1, meteor.point.x, meteor.point.y, meteor.point.z);
  positions.needsUpdate = true;
  shootingStar.material.opacity = night * Math.sin(Math.min(p, 1) * Math.PI);
  if (p >= 1) {
    shootingStar.visible = false;
    meteor.timer = 5 + Math.random() * 9;
  }
}

const swayUniforms = { time: { value: 0 }, wind: { value: 1 }, light: { value: new THREE.Color(1, 1, 1) } };
function makeSwayMaterial(flowerHeads) {
  return new THREE.ShaderMaterial({
    uniforms: { ...THREE.UniformsUtils.clone(THREE.UniformsLib.fog), ...swayUniforms, ...cloudUniforms, flowerHeads: { value: flowerHeads ? 1 : 0 } },
    vertexShader: `attribute vec3 tint;
      uniform float time; uniform float wind;
      varying vec3 vTint; varying float vHeight; varying vec3 vCloudWorld;
      #include <fog_pars_vertex>
      void main() {
        vec4 world = modelMatrix * instanceMatrix * vec4(position, 1.0);
        float bend = uv.y * uv.y * wind;
        float sway = sin(time * 1.6 + world.x * 0.35 + world.z * 0.25) + sin(time * 3.1 + world.x * 1.3) * 0.3;
        world.xz += vec2(0.12, 0.05) * sway * bend;
        vCloudWorld = world.xyz;
        vTint = tint;
        vHeight = uv.y;
        vec4 mvPosition = viewMatrix * world;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `uniform vec3 light; uniform float flowerHeads;
      varying vec3 vTint; varying float vHeight; varying vec3 vCloudWorld;
      ${CLOUD_SHADOW_GLSL}
      #include <fog_pars_fragment>
      void main() {
        vec3 stem = vec3(0.16, 0.26, 0.1);
        vec3 col = flowerHeads > 0.5
          ? (vHeight > 0.97 ? vTint : mix(stem * 0.6, stem, vHeight))
          : mix(stem * 0.55, vTint, vHeight);
        gl_FragColor = vec4(col * light * cloudShadow(vCloudWorld), 1.0);
        #include <fog_fragment>
      }`,
    fog: true,
    side: THREE.DoubleSide
  });
}

const ringPlace = (minRadius, maxRadius) => () => {
  let x, z;
  do {
    const radius = Math.sqrt(minRadius ** 2 + Math.random() * (maxRadius ** 2 - minRadius ** 2));
    const angle = Math.random() * Math.PI * 2;
    x = Math.cos(angle) * radius;
    z = Math.sin(angle) * radius;
  } while (insideLake(x, z, 2.5) || underHill(x, z) || nearCamp(x, z, 0));

// Lightning whenever it rains, most often in a thunderstorm: a jagged forked bolt far off, a double
// flash across the sky and thunder rolling in a few seconds later (longer for more distant strikes)
const LIGHTNING = { minGap: 1.5, maxGap: 5, rainGapFactor: 2, minDistance: 120, maxDistance: 320, top: 75, steps: 14 };
const bolt = new THREE.Mesh(
  new THREE.BufferGeometry(),
  new THREE.MeshBasicMaterial({ color: 0xe8e6ff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false })
);

const lightning = { timer: 2, age: Infinity };
function jaggedPath(from, steps, stepDown, wander, right) {
  const points = [from.clone()];
  for (let i = 0; i < steps; i++) {
    const p = points[points.length - 1].clone();
    p.y -= stepDown;
    p.addScaledVector(right, (Math.random() - 0.5) * wander);
    points.push(p);
  }
  return points;
}
// A flat ribbon along the path, facing the camera, since WebGL lines are only a pixel wide
function addRibbon(points, width, right, out) {
  for (let i = 0; i < points.length - 1; i++) {
    const half = (width * (1 - (0.5 * i) / points.length)) / 2;
    const [a, b] = [points[i], points[i + 1]];
    const corners = [[a, -half], [a, half], [b, half], [a, -half], [b, half], [b, -half]];
    for (const [p, offset] of corners) out.push(p.x + right.x * offset, p.y, p.z + right.z * offset);
  }
}
function strike() {

  const angle = (Math.random() < 0.7 ? Math.PI : 0) + (Math.random() - 0.5) * 2.2;
  const distance = LIGHTNING.minDistance + Math.random() * (LIGHTNING.maxDistance - LIGHTNING.minDistance);
  const base = new THREE.Vector3(camera.position.x + Math.sin(angle) * distance, groundY + LIGHTNING.top, camera.position.z + Math.cos(angle) * distance);
  const toCamera = new THREE.Vector3().subVectors(camera.position, base).setY(0).normalize();
  const right = new THREE.Vector3(-toCamera.z, 0, toCamera.x);
  const stepDown = LIGHTNING.top / LIGHTNING.steps;
  const main = jaggedPath(base, LIGHTNING.steps, stepDown, 10, right);
  const positions = [];
  addRibbon(main, 1.4, right, positions);
  const forks = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < forks; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const fork = jaggedPath(main[3 + Math.floor(Math.random() * 6)], 5, stepDown * 0.8, 10, right);
    fork.forEach((p, k) => p.addScaledVector(right, side * k * 3));
    addRibbon(fork, 0.7, right, positions);
  }
  bolt.geometry.dispose();
  bolt.geometry = new THREE.BufferGeometry();
  bolt.geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));

}
// A bright flash, a dimmer flicker a moment later, then dark

}
function updateLightning(dt) {

  bolt.visible = weather.flash > 0.02;
  bolt.material.opacity = weather.flash;
  if (weather.rain < 0.6) return;
  lightning.timer -= dt;
  if (lightning.timer <= 0) {

    const gapFactor = lerp(LIGHTNING.rainGapFactor, 1, weather.storm);
    lightning.timer = (LIGHTNING.minGap + Math.random() * (LIGHTNING.maxGap - LIGHTNING.minGap)) * gapFactor;
  }
}

// Weather: long clear spells, now and then clouding over into light rain or a thunderstorm,
// with a rainbow as it clears
const STORM_CHANCE = 0.4;
const weather = { phase: "clear", timer: 50, overcast: 0, rain: 0, storm: 0, rainbow: 0, flash: 0 };
const NEXT_WEATHER = { clear: "overcast", overcast: "rain", rain: "clearing", storm: "clearing", clearing: "clear" };
const WEATHER_SECONDS = {
  clear: () => 70 + Math.random() * 60,
  overcast: () => 12 + Math.random() * 8,
  rain: () => 25 + Math.random() * 15,
  storm: () => 30 + Math.random() * 15,
  clearing: () => 20
};
function updateWeather(dt) {
  weather.timer -= dt;
  if (weather.timer <= 0) {
    weather.phase = weather.phase === "overcast" && Math.random() < STORM_CHANCE ? "storm" : NEXT_WEATHER[weather.phase];
    weather.timer = WEATHER_SECONDS[weather.phase]();
    if (weather.phase === "clearing") placeRainbow(-Math.sign(SUN_DIR.x) || 1);
  }
  const wet = weather.phase === "rain" || weather.phase === "storm";
  weather.overcast += ((wet || weather.phase === "overcast" ? 1 : 0) - weather.overcast) * easeFactor(dt, 0.3);

  weather.storm += ((weather.phase === "storm" ? 1 : 0) - weather.storm) * easeFactor(dt, 0.4);
  const rainbowWanted = weather.phase === "clearing" && sunHeight > 0.03;

// Day cycle: the sun rises behind the left hills at 06:00, arcs across the sky
// and sets behind the right hills at 20:00, then passes under the night back to dawn
const SUNRISE = 6;

const SUN_SWING = 0.7;              // radians left and right of centre where the sun rises and sets
const NOON_ELEVATION = 0.96;        // about 55° above the horizon
const MIDNIGHT_DEPTH = 0.6;         // how far below the horizon the sun sinks at night
const MOON_PEAK = 0.4;              // kept low so the moon's streak lands on the lake

// Sky and light colours keyed by the sun's height (the y of SUN_DIR)
const PALETTES = [
  { at: -0.25, top: 0x0b1230, mid: 0x1b2550, horizon: 0x2a3460, sun: 0x000000, skyLight: 0x5a6a9a, groundLight: 0x14181c, light: 0.45, hill: 0x1a1c2c, cloud: 0x4a5070, cloudGlow: 0x10142a, deep: 0x070b18 },
  { at: -0.05, top: 0x1e2a5a, mid: 0x7a5a8a, horizon: 0xe0806a, sun: 0xff8a50, skyLight: 0xc89aa0, groundLight: 0x3a3040, light: 0.6, hill: 0x3e3550, cloud: 0xf0a8a0, cloudGlow: 0x502838, deep: 0x141a32 },
  { at: 0.08, top: 0x2c3a6e, mid: 0xd9748a, horizon: 0xf7a35c, sun: 0xffb35c, skyLight: 0xf2c6a8, groundLight: 0x4a3a40, light: 0.85, hill: 0x5a4a5e, cloud: 0xffd2b8, cloudGlow: 0x6a3a4a, deep: 0x1f2a44 },
  { at: 0.45, top: 0x3a78c8, mid: 0x8fbde6, horizon: 0xd6e8f2, sun: 0xfff2d0, skyLight: 0xe2efff, groundLight: 0x5b7a3a, light: 1.0, hill: 0x7a9070, cloud: 0xffffff, cloudGlow: 0x3a4250, deep: 0x2a4a6a }
];
const GOLDEN_HOUR = PALETTES[2];
// Dawn's golden hour is softer and pinker than dusk's
const DAWN_GOLDEN_HOUR = { ...GOLDEN_HOUR, top: 0x4a5c94, mid: 0xe7a0b0, horizon: 0xf6b88a, sun: 0xffc890, skyLight: 0xf4d0c0, hill: 0x6a5a72, cloud: 0xffe0d4 };

const dayColors = Object.fromEntries(COLOR_KEYS.map(key => [key, new THREE.Color()]));
const mixColor = new THREE.Color();

const greyColor = new THREE.Color();
const sunTint = new THREE.Color();

let mistAmount = 0;
let beamAmount = 0;

function paletteColor(palette, key, evening, out) {
  if (palette !== GOLDEN_HOUR) return out.set(palette[key]);
  return out.set(DAWN_GOLDEN_HOUR[key]).lerp(dawnColor.set(palette[key]), evening);
}
function greyOut(color, amount) {

function updateDayCycle() {
  const daylight = hour >= SUNRISE && hour <= SUNSET;
  const arc = daylight
    ? ((hour - SUNRISE) / (SUNSET - SUNRISE)) * Math.PI
    : Math.PI + (((hour - SUNSET + 24) % 24) / (24 - SUNSET + SUNRISE)) * Math.PI;
  skyDirection(arc, daylight ? NOON_ELEVATION : MIDNIGHT_DEPTH, SUN_DIR);
  // The moon follows the same arc half a day later, so it crosses the front of the sky at night
  skyDirection(arc + Math.PI, MOON_PEAK, MOON_DIR);

  sunHeight = SUN_DIR.y;
  const evening = smoothstep(SUN_DIR.x, -0.25, 0.25);
  let i = 0;
  while (i < PALETTES.length - 2 && sunHeight > PALETTES[i + 1].at) i++;
  const from = PALETTES[i];
  const to = PALETTES[i + 1];
  const t = smoothstep(sunHeight, from.at, to.at);
  for (const key of COLOR_KEYS) {
    paletteColor(from, key, evening, dayColors[key]).lerp(paletteColor(to, key, evening, mixColor), t);
  }
  const overcast = weather.overcast;
  const storm = weather.storm;
  for (const key of ["top", "mid", "horizon", "skyLight", "cloud"]) {
    greyOut(dayColors[key], overcast * 0.75).multiplyScalar(1 - 0.35 * storm);
  }
  dayColors.cloud.multiplyScalar(1 - 0.3 * overcast);
  dayColors.sun.multiplyScalar(1 - 0.85 * overcast);
  // Lightning lights up the whole sky for an instant
  for (const key of ["top", "mid", "horizon"]) dayColors[key].lerp(FLASH_COLOR, weather.flash * 0.6);

  skyUniforms.top.value.copy(dayColors.top);
  skyUniforms.mid.value.copy(dayColors.mid);
  skyUniforms.horizon.value.copy(dayColors.horizon);
  skyUniforms.sunColor.value.copy(dayColors.sun);
  skyUniforms.sunVis.value = 1 - overcast;
  const moonLit = (1 - Math.cos(moonPhase)) / 2; // fraction of the disc in sunlight
  const moonVis = smoothstep(MOON_DIR.y, -0.02, 0.06) * (1 - smoothstep(sunHeight, -0.1, 0.05)) * (1 - 0.85 * overcast);
  skyUniforms.moonVis.value = moonVis;
  skyUniforms.moonPhase.value = moonPhase;
  skyUniforms.moonLit.value = moonLit;
  scene.fog.color.copy(dayColors.horizon).multiplyScalar(0.92);
  scene.fog.near = lerp(45, 20, overcast);
  scene.fog.far = lerp(420, 180, overcast);

  skyLight.color.copy(dayColors.skyLight);
  skyLight.groundColor.copy(dayColors.groundLight);
  skyLight.intensity = lerp(from.light, to.light, t) * (1 - 0.25 * overcast) + weather.flash * 1.5;
  sun.color.copy(dayColors.sun);
  sun.intensity = 0.9 * smoothstep(sunHeight, -0.05, 0.1);
  moonLight.intensity = 0.3 * moonVis * moonLit;
  moonLight.position.copy(MOON_DIR).multiplyScalar(100);

  hillMat.color.copy(dayColors.hill);
  cloudMat.color.copy(dayColors.cloud);
  cloudMat.emissive.copy(dayColors.cloudGlow);
  waterUniforms.deep.value.copy(dayColors.deep);
  waterUniforms.rain.value = weather.rain;
  stars.material.opacity = (1 - smoothstep(sunHeight, -0.2, -0.04)) * (1 - overcast);
  swayUniforms.light.value.copy(skyLight.color).multiplyScalar(skyLight.intensity * 0.9)
    .add(sunTint.copy(sun.color).multiplyScalar(sun.intensity * 0.45));
  // Gusts come and go through a thunderstorm
  const gusts = storm * (1.5 + 1.5 * Math.sin(elapsed * 0.7) * Math.sin(elapsed * 1.9));
  swayUniforms.wind.value = 1 + weather.rain * 1.4 + overcast * 0.4 + gusts;
  cloudUniforms.cloudShade.value = 0.35 * smoothstep(sunHeight, 0.02, 0.15) * (1 - overcast);
  fireflyMat.uniforms.visibility.value = (1 - smoothstep(sunHeight, -0.05, 0.04)) * (1 - weather.rain);
  mistAmount = smoothstep(hour, 4.5, 5.5) * (1 - smoothstep(hour, 7.8, 9.5));
  mistColor.set(0xffffff).lerp(dayColors.horizon, 0.45);
  beamAmount = smoothstep(sunHeight, 0.04, 0.15) * (1 - smoothstep(sunHeight, 0.45, 0.75)) * (1 - overcast) * 0.16;
  rainbow.material.uniforms.opacity.value = weather.rainbow * 0.4;
  rainbow.visible = weather.rainbow > 0.01;
  const auroraLevel = auroraTonight ? (1 - smoothstep(sunHeight, -0.2, -0.06)) * (1 - overcast) : 0;
  aurora.material.uniforms.opacity.value = auroraLevel;
  aurora.visible = auroraLevel > 0.01;
}

function dayPart(h) {
  if (h < 5 || h >= 21) return "Night";

  if (h < 11) return "Morning";

// Far-off birds crossing the landscape in small flocks

  // Mostly in front of the starting view, sometimes behind it

  flock.position.set(anywhere ? (Math.random() * 2 - 1) * 120 : -FLOCK_EDGE * dir, 12 + Math.random() * 18, side * (70 + Math.random() * 90));

  else if (state === "look" || state === "alert") d.timer = 2 + Math.random() * 2;
  else if (state === "flee") d.timer = 2.2 + Math.random();
  else if (state === "walk") {
    // Amble about at home; from anywhere else, head back home
    const home = atHome(deer.position);
    d.timer = home ? 2 + Math.random() * 3 : 8;
    d.targetHeading = home
      ? deer.rotation.y + (Math.random() - 0.5) * 2
      : Math.atan2((DEER_HOME.xMin + DEER_HOME.xMax) / 2 - x, (DEER_HOME.zMin + DEER_HOME.zMax) / 2 - z);
  } else if (state === "toWater") {
    const angle = Math.PI * (0.25 + Math.random() * 0.2);
    d.target.set(LAKE.x + (LAKE.rx + DEER_SHORE_MARGIN) * Math.cos(angle), groundY, LAKE.z - (LAKE.rz + DEER_SHORE_MARGIN) * Math.sin(angle));
    d.timer = 40;

    shoulder.quaternion.setFromEuler(armSwing.set(lerp(Math.sin(c.walkPhase + phase) * 0.45 * stride, -0.5, c.sit), 0, side * 0.08));
    // The right arm points straight at the eagle
    if (side < 0 && c.point > 0.001) {
      armAim.setFromUnitVectors(ARM_DOWN, lookLocal.copy(eagleLocal).sub(shoulder.position).normalize());
      shoulder.quaternion.slerp(armAim, c.point);
    }
  }
  // Glance about while idle; follow the eagle while pointing
  lookLocal.copy(eagleLocal).sub(head.position);
  const glance = c.state === "stand" || c.state === "sit" ? Math.sin(now * 0.4 + c.seed) * 0.6 : 0;
  head.rotation.y = lerp(glance, clamp(Math.atan2(lookLocal.x, lookLocal.z), -1.2, 1.2), c.point);
  head.rotation.x = -Math.atan2(lookLocal.y, Math.hypot(lookLocal.x, lookLocal.z)) * c.point;
}

function updateCamp(dt, now) {
  const night = hour >= CAMP_BEDTIME || hour < SUNRISE;
  camp.fire += ((night ? 1 : 0) - camp.fire) * easeFactor(dt, 0.8);
  // The lamp is only lit after dark, not when they're sheltering from rain by day
  const inside = campers.some(camper => camper.userData.state === "inTent");
  camp.lamp += ((inside && night ? 1 : 0) - camp.lamp) * easeFactor(dt, 3);
  for (const camper of campers) updateCamper(camper, dt, now, night || weather.rain > CAMPER_SHELTER_RAIN);

  const burning = camp.fire > 0.01;
  const flicker = 0.85 + 0.15 * Math.sin(now * 21) * Math.sin(now * 8.3 + 1);
  flames.forEach((flame, i) => {
    flame.visible = burning;
    const lick = 1 + 0.22 * Math.sin(now * (9 + i * 2.7) + i * 2) + 0.1 * Math.sin(now * 23 + i * 5);
    const width = camp.fire * (1.1 - 0.1 * lick);
    flame.scale.set(width, camp.fire * lick, width);
    flame.rotation.z = Math.sin(now * 4.3 + i * 1.7) * 0.15;
  });
  fireGlow.visible = fireGroundGlow.visible = burning;
  fireGlow.material.opacity = 0.4 * camp.fire * flicker;
  fireGroundGlow.material.opacity = 0.5 * camp.fire * flicker;
  fireLight.intensity = 1.5 * camp.fire * flicker;
  updateSparks(dt);
  tentMat.emissive.copy(LAMP_COLOR).multiplyScalar(0.45 * camp.lamp);
  tentDoorMat.emissive.copy(LAMP_COLOR).multiplyScalar(0.9 * camp.lamp);
  tentGroundGlow.visible = camp.lamp > 0.01;
  tentGroundGlow.material.opacity = 0.3 * camp.lamp;
}

// Flat outline in the XY plane (x outward, y forward), laid into a bird's XZ plane
function flatPart(points, mirror) {
  const shape = new THREE.Shape();
  points.forEach(([x, y], i) => (i ? shape.lineTo(mirror ? -x : x, y) : shape.moveTo(mirror ? -x : x, y)));
  const geo = new THREE.ShapeGeometry(shape);
  geo.rotateX(Math.PI / 2);
  return geo;
}

// Splashes: droplets thrown up and rings spreading across the water, reused from a small pool
const RIPPLE_SECONDS = 2.4;
const splashMat = new THREE.MeshBasicMaterial({ color: 0xfff1e0 });
const splashes = Array.from({ length: 4 }, () => ({
  age: Infinity,
  strength: 1,
  droplets: Array.from({ length: 14 }, () => {
    const drop = new THREE.Mesh(new THREE.SphereGeometry(0.03, 6, 4), splashMat);
    drop.visible = false;
    drop.userData.velocity = new THREE.Vector3();
    scene.add(drop);
    return drop;
  }),
  ripples: Array.from({ length: 3 }, () => {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.92, 1, 48).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffe3c4, transparent: true, depthWrite: false })
    );
    ring.visible = false;

    scene.add(ring);
    return ring;
  })

function splash(at, strength) {
  const s = splashes.reduce((oldest, candidate) => (candidate.age > oldest.age ? candidate : oldest));
  s.age = 0;
  s.strength = strength;
  const lift = Math.sqrt(strength);
  for (const drop of s.droplets) {
    const angle = Math.random() * Math.PI * 2;
    const outward = (0.5 + Math.random() * 1.2) * lift;
    drop.position.set(at.x, LAKE.y, at.z);
    drop.userData.velocity.set(Math.cos(angle) * outward, (2 + Math.random() * 2.2) * lift, Math.sin(angle) * outward);
    drop.visible = true;
  }
  for (const ring of s.ripples) ring.position.set(at.x, LAKE.y + 0.01, at.z);
  splashSound(strength, at);
}

  for (const s of splashes) {
    if (s.age > RIPPLE_SECONDS * 2) continue;
    s.age += dt;
    for (const drop of s.droplets) {
      if (!drop.visible) continue;
      drop.userData.velocity.y -= 9.8 * dt;
      drop.position.addScaledVector(drop.userData.velocity, dt);
      if (drop.position.y < LAKE.y) drop.visible = false;
    }
    s.ripples.forEach((ring, i) => {
      const age = Math.max(s.age - i * 0.35, 0);
      ring.visible = s.age - i * 0.35 > 0 && age < RIPPLE_SECONDS;
      ring.scale.setScalar((0.2 + age * 1.1) * (0.5 + 0.5 * s.strength));
      ring.material.opacity = 0.7 * (1 - age / RIPPLE_SECONDS);
    });
  }
}

// Now and then a fish leaps clear of the water
const JUMP_SECONDS = 0.9;
const JUMP_HEIGHT = 0.9;
const JUMP_LENGTH = 1.3;

jumper.scale.setScalar(1.6);
jumper.visible = false;
castShadows(jumper);
scene.add(jumper);
const jump = { timer: 4, time: 0, from: new THREE.Vector3(), to: new THREE.Vector3() };
function updateJumper(dt) {
  if (!jumper.visible) {
    jump.timer -= dt;
    if (jump.timer > 0) return;
    // Leap from one of the fish shapes under the surface
    const leaper = pickShadowFish(0.75);
    if (leaper) {
      jump.from.set(leaper.position.x, LAKE.y, leaper.position.z);
      hideShadowFish(leaper, JUMP_SECONDS + 4);
    } else {
      randomLakePoint(0.7, jump.from).setY(LAKE.y);
    }
    const direction = Math.random() * Math.PI * 2;
    jump.to.set(jump.from.x + Math.sin(direction) * JUMP_LENGTH, LAKE.y, jump.from.z + Math.cos(direction) * JUMP_LENGTH);
    jump.time = 0;
    jumper.visible = true;
    splash(jump.from, 0.35);
  }
  jump.time += dt;
  const p = Math.min(jump.time / JUMP_SECONDS, 1);
  jumper.position.lerpVectors(jump.from, jump.to, p);
  jumper.position.y = LAKE.y + Math.sin(p * Math.PI) * JUMP_HEIGHT - 0.05;
  // Nose follows the arc: up on the way out, down on the way back in
  const slope = (JUMP_HEIGHT * Math.PI * Math.cos(p * Math.PI)) / JUMP_LENGTH;
  jumper.rotation.set(-Math.atan(slope), Math.atan2(jump.to.x - jump.from.x, jump.to.z - jump.from.z), 0, "YXZ");
  if (p >= 1) {
    jumper.visible = false;
    jump.timer = 5 + Math.random() * 8;
    splash(jump.to, 0.45);
  }
}

// Dark shapes of fish cruising just under the surface. The eagle dives on one of them and the
// leaping fish comes from one, so a sharp eye can spot the next catch before the eagle does.
const FISH_SHADOW_SPEED = 0.4;
const lakeReach = ({ x, z }) => Math.hypot((x - LAKE.x) / LAKE.rx, (z - LAKE.z) / LAKE.rz);
function randomLakePoint(maxReach, out) {
  const angle = Math.random() * Math.PI * 2;
  const reach = Math.sqrt(Math.random()) * maxReach;
  return out.set(LAKE.x + Math.cos(angle) * reach * LAKE.rx, LAKE.y + 0.005, LAKE.z + Math.sin(angle) * reach * LAKE.rz);
}
const fishShadowMat = new THREE.MeshBasicMaterial({ map: softTex, color: 0x08121a, transparent: true, opacity: 0.4, depthWrite: false });
const fishShadows = Array.from({ length: 6 }, () => {
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.9).rotateX(-Math.PI / 2), fishShadowMat);
  randomLakePoint(0.75, shadow.position);
  shadow.rotation.y = Math.random() * Math.PI * 2;
  shadow.layers.set(NOT_REFLECTED);
  Object.assign(shadow.userData, { heading: shadow.rotation.y, timer: 0, hidden: 0, held: false, seed: Math.random() * 10 });
  scene.add(shadow);

});
function pickShadowFish(maxReach) {
  const choices = fishShadows.filter(s => s.visible && !s.userData.held && lakeReach(s.position) < maxReach);
  return choices.length ? choices[Math.floor(Math.random() * choices.length)] : null;

}
function updateFishShadows(dt, now) {
  for (const shadow of fishShadows) {
    const s = shadow.userData;
    if (!shadow.visible) {
      s.hidden -= dt;
      if (s.hidden <= 0) {
        randomLakePoint(0.75, shadow.position);
        shadow.visible = true;
      }
      continue;
    }
    if (s.held) continue; // stays put while the eagle closes in
    s.timer -= dt;
    if (lakeReach(shadow.position) > 0.78) s.heading = Math.atan2(LAKE.x - shadow.position.x, LAKE.z - shadow.position.z);
    else if (s.timer <= 0) {
      s.heading += (Math.random() - 0.5) * 2;
      s.timer = 2 + Math.random() * 4;
    }
    shadow.rotation.y += turnTowards(shadow.rotation.y, s.heading) * easeFactor(dt, 1.5);
    shadow.position.x += Math.sin(shadow.rotation.y) * FISH_SHADOW_SPEED * dt;
    shadow.position.z += Math.cos(shadow.rotation.y) * FISH_SHADOW_SPEED * dt;
    shadow.scale.x = 1 + Math.sin(now * 6 + s.seed) * 0.12; // tail beat
  }

// Sound, all synthesised with Web Audio: wind, rain, thunder, birdsong by day, crickets, frogs and
// the owl at night, splashes and the eagle's call
const sound = { ctx: null, on: false, birdTimer: 1, cricketTimer: 1, frogTimer: 3, owlTimer: 4 };
function startSound() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain();
  master.gain.value = 0.8;
  master.connect(ctx.destination);
  const noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const samples = noise.getChannelData(0);
  for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
  const loopNoise = () => {
    const source = ctx.createBufferSource();
    source.buffer = noise;
    source.loop = true;
    source.start();
    return source;
  };
  const windFilter = ctx.createBiquadFilter();
  windFilter.type = "lowpass";
  windFilter.frequency.value = 500;
  const windGain = ctx.createGain();
  windGain.gain.value = 0;
  loopNoise().connect(windFilter).connect(windGain).connect(master);
  const rainFilter = ctx.createBiquadFilter();
  rainFilter.type = "bandpass";
  rainFilter.frequency.value = 3200;
  rainFilter.Q.value = 0.4;
  const rainGain = ctx.createGain();
  rainGain.gain.value = 0;
  loopNoise().connect(rainFilter).connect(rainGain).connect(master);
  Object.assign(sound, { ctx, master, noise, windFilter, windGain, rainGain });
}
function tone({ type = "sine", freq, freqEnd, start, duration, gain, pan = 0, filter }) {
  const { ctx } = sound;
  const osc = ctx.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, start + duration);
  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.exponentialRampToValueAtTime(gain, start + Math.min(0.015, duration / 3));
  envelope.gain.exponentialRampToValueAtTime(0.0001, start + duration);
  let node = (filter ? osc.connect(filter) : osc).connect(envelope);
  if (ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.value = pan;
    node = node.connect(panner);
  }
  node.connect(sound.master);
  osc.start(start);
  osc.stop(start + duration + 0.05);
}
const randomPan = () => Math.random() * 1.6 - 0.8;
function birdPhrase() {
  const start = sound.ctx.currentTime;
  const pitch = 2200 + Math.random() * 1800;
  const pan = randomPan();
  const notes = 2 + Math.floor(Math.random() * 4);
  for (let i = 0; i < notes; i++) {
    tone({ freq: pitch * (1 + Math.random() * 0.25), freqEnd: pitch * (1.25 + Math.random() * 0.4), start: start + i * 0.12, duration: 0.08, gain: 0.025, pan });
  }
}

  const start = sound.ctx.currentTime;

}
function frogCroak() {
  const start = sound.ctx.currentTime;
  const pan = randomPan();
  for (let i = 0; i < 2; i++) {
    const filter = sound.ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 450;
    filter.Q.value = 4;
    tone({ type: "sawtooth", freq: 150, freqEnd: 105, start: start + i * 0.3, duration: 0.2, gain: 0.08, pan, filter });
  }

// The bald eagle's high, thin "kleek-kik-ik-ik" chatter
function eagleCall() {
  if (!sound.on) return;
  const start = sound.ctx.currentTime;
  for (let i = 0; i < 5; i++) tone({ freq: 3300 - i * 140, freqEnd: 2700 - i * 120, start: start + i * 0.13, duration: 0.1, gain: 0.035 });
}
// The great horned owl's deep "hoo, h'hoo, hoo, hoo"
function owlHoot(pan) {
  const start = sound.ctx.currentTime;
  [[0, 0.35, 360], [0.55, 0.15, 380], [0.75, 0.3, 370], [1.2, 0.45, 345]].forEach(([at, duration, freq]) =>
    tone({ freq, freqEnd: freq * 0.96, start: start + at, duration, gain: 0.07, pan }));

// A crack and a long low rumble, arriving `delay` seconds after the flash
function thunder(delay, loudness) {
  if (!sound.on) return;
  const { ctx } = sound;
  const start = ctx.currentTime + delay;
  const source = ctx.createBufferSource();
  source.buffer = sound.noise;
  source.playbackRate.value = 0.5; // stretches the noise to 4 seconds and deepens it
  const filter = ctx.createBiquadFilter();
  filter.type = "lowpass";
  filter.frequency.value = 180;
  const envelope = ctx.createGain();
  envelope.gain.setValueAtTime(0.0001, start);
  envelope.gain.linearRampToValueAtTime(0.6 * loudness, start + 0.08);
  envelope.gain.setTargetAtTime(0.25 * loudness, start + 0.25, 0.35);
  envelope.gain.setTargetAtTime(0.0001, start + 1.4, 0.8);

  source.stop(start + 4);
}

  const { ctx } = sound;
  const start = ctx.currentTime;
  const source = ctx.createBufferSource();
  source.buffer = sound.noise;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = 900;
  filter.Q.value = 0.7;
  const envelope = ctx.createGain();

function updateSound(dt, now) {
  if (!sound.on) return;
  const at = sound.ctx.currentTime;
  const windLevel = 0.05 + 0.025 * Math.sin(now * 0.3) + weather.overcast * 0.02 + weather.rain * 0.04 + weather.storm * 0.06;
  sound.windGain.gain.setTargetAtTime(windLevel, at, 0.5);
  sound.windFilter.frequency.setTargetAtTime(420 + 220 * Math.sin(now * 0.17), at, 0.5);
  sound.rainGain.gain.setTargetAtTime(weather.rain * 0.16 + weather.storm * 0.06, at, 0.5);
  sound.birdTimer -= dt;
  sound.cricketTimer -= dt;
  sound.frogTimer -= dt;
  sound.owlTimer -= dt;
  if (sound.owlTimer <= 0) {
    if (owl.visible) owlHoot(clamp((owl.position.x - camera.position.x) / 40, -0.8, 0.8));
    sound.owlTimer = 6 + Math.random() * 7;
  }
  if (sound.birdTimer <= 0) {
    if (sunHeight > 0.03 && weather.rain < 0.3) birdPhrase();
    sound.birdTimer = 1 + Math.random() * 3;
  }
  if (sound.cricketTimer <= 0) {
    if (sunHeight < -0.03) cricketTrill();
    sound.cricketTimer = 0.4 + Math.random() * 0.8;
  }
  if (sound.frogTimer <= 0) {
    if (sunHeight < 0.02) frogCroak();
    sound.frogTimer = 2.5 + Math.random() * 5;
  }
}

// Flight with the camera fixed: a looping figure that scales with distance, so the bird stays in frame
function loopPoint(time, d, out) {
  const spread = Math.min(camera.aspect, 1.5);
  return out.set(
    Math.sin(time * 0.45) * d * 0.34 * spread,
    d * 0.06 + Math.sin(time * 0.7) * d * 0.06,
    -d + Math.sin(time * 0.9) * d * 0.2

}

const TOUR_RATE = 0.09;
function tourPoint(time, out) {
  return out.set(
    90 * Math.sin(time * TOUR_RATE),
    groundY + 13 + 5 * Math.sin(time * 0.31),
    -40 + 70 * Math.sin(time * TOUR_RATE * 2 + 0.6)

const velocity = new THREE.Vector3();
const heading = new THREE.Vector3(1, 0, 0);
const lastHeading = heading.clone();
const lookTarget = new THREE.Vector3();

// Fishing: dive and skim the lake → snatch a fish → carry it to the snag → perch and eat → take off
const DIVE_SECONDS = 5.5;
const SKIM_LENGTH = 12;
const FIRST_DIVE_SECONDS = 8;
const PERCH_SECONDS = 9;
const TAKEOFF_SECONDS = 4.5;
const DIVE_RANGE = 40; // when following, dive only once the tour brings the eagle this close to the lake
const SHELTER_MIN_SECONDS = 3;
// Harassing the neighbours, once each time the cruise brings the eagle near them: a figure of
// eight centred on the fox, swooping low over it twice, or a chase on the owl's tail
const BUZZ_RANGE = 30;
const BUZZ_SECONDS = 9;
const BUZZ_REACH = 12; // how far past the fox each swoop runs before turning back
const BUZZ_WIDTH = 5;
const BUZZ_LOW = 1.5;  // height above the ground when passing over the fox
const BUZZ_CLIMB = 9;
const CHASE_RANGE = 25;
const CHASE_SECONDS = 10;
const LEAVE_FACTOR = 1.5; // how much further than its range the eagle must get to forget an animal
const eagle = {
  mode: "cruise", time: 0, weight: 0, diveTimer: FIRST_DIVE_SECONDS, caught: false, travelSeconds: 3, prey: null, shelter: false,
  metFox: false, metOwl: false,
  catchPoint: new THREE.Vector3(), skim: new THREE.Vector3(), start: new THREE.Vector3(), control: new THREE.Vector3()
};
const nearCruise = (animal, range) => animal.visible && Math.hypot(animal.position.x - cruise.x, animal.position.z - cruise.z) < range;
const flatHeading = new THREE.Vector3();
// Where the eagle is while busy fishing; `eagle.weight` blends it in over the cruise path
const special = new THREE.Vector3();
function setEagleMode(mode) {
  eagle.mode = mode;
  eagle.time = 0;
}
function startDive() {
  const spread = touring() ? 1 : Math.min(camera.aspect, 1.2);
  eagle.skim.set(heading.x, 0, heading.z);
  if (eagle.skim.lengthSq() < 1e-4) eagle.skim.set(1, 0, 0);
  eagle.skim.normalize();
  // Go for one of the fish visible under the surface, which waits there until it's caught
  eagle.prey = pickShadowFish(0.6);
  if (eagle.prey) {
    eagle.prey.userData.held = true;
    eagle.catchPoint.set(eagle.prey.position.x, LAKE.y + 0.3, eagle.prey.position.z);
  } else {
    eagle.catchPoint.set(LAKE.x + (Math.random() * 2 - 1) * 4 * spread, LAKE.y + 0.3, LAKE.z + (Math.random() * 2 - 1) * 4);
  }
  eagle.caught = false;
  setEagleMode("dive");
  eagleCall();
}
// Fly to the snag along a curve that rises over the shore, from wherever the eagle is now
function flyToPerch(from, push) {
  eagle.start.copy(from);
  eagle.control.copy(from).add(PERCH).multiplyScalar(0.5).addScaledVector(push, 4);
  eagle.control.y = Math.max(from.y, PERCH.y) + 3;
  eagle.travelSeconds = Math.max(3, from.distanceTo(PERCH) / 6);
  setEagleMode("toPerch");
}
function bezier(a, b, c, t, out) {
  const s = 1 - t;
  return out.set(0, 0, 0).addScaledVector(a, s * s).addScaledVector(b, 2 * s * t).addScaledVector(c, t * t);
}

function updateFlightPath(dt) {
  // Cruising pauses while the eagle is busy fishing, so it rejoins the path where it left off
  const cruiseRate = dt * (1 - eagle.weight);
  distance += (targetDistance - distance) * easeFactor(dt, 0.9);
  flightTime += cruiseRate * 0.8 * Math.pow(DISTANCES.away / distance, 0.35);
  tourTime += cruiseRate;
  followBlend += ((touring() ? 1 : 0) - followBlend) * easeFactor(dt, 0.6);
  cruise.lerpVectors(loopPoint(flightTime, distance, loop), tourPoint(tourTime, tour), followBlend);

  const pose = { talons: 0, glide: null, fold: 0, eat: 0 };
  eagle.time += dt;
  switch (eagle.mode) {
    case "cruise": {
      eagle.weight = 0;
      if (weather.phase === "storm") {
        // Sit the storm out on the snag
        eagle.shelter = true;
        flyToPerch(cruise, flatHeading.set(heading.x, 0, heading.z).normalize());
        break;
      }
      if (!nearCruise(fox, BUZZ_RANGE * LEAVE_FACTOR)) eagle.metFox = false;
      if (!nearCruise(owl, CHASE_RANGE * LEAVE_FACTOR)) eagle.metOwl = false;
      if (!eagle.metFox && nearCruise(fox, BUZZ_RANGE)) {
        eagle.metFox = true;
        // Line up the swoops from the side the eagle comes in on
        eagle.skim.set(fox.position.x - cruise.x, 0, fox.position.z - cruise.z).normalize();
        setEagleMode("buzz");
        eagleCall();
        break;
      }
      if (!eagle.metOwl && nearCruise(owl, CHASE_RANGE)) {
        eagle.metOwl = true;
        setEagleMode("chase");
        eagleCall();
        break;
      }
      eagle.diveTimer -= dt;
      if (eagle.diveTimer <= 0 && Math.hypot(cruise.x - LAKE.x, cruise.z - LAKE.z) < DIVE_RANGE) startDive();
      break;
    }
    case "buzz": {
      // Glide down and over the fox, talons forward, then beat back up into a turn at each end
      const u = eagle.time / BUZZ_SECONDS;
      const t = (u * 2 - 0.5) * Math.PI;
      const low = Math.cos(t) ** 2;
      eagle.weight = smoothstep(u, 0, 0.2) * (1 - smoothstep(u, 0.85, 1));
      special.copy(fox.position)
        .addScaledVector(eagle.skim, BUZZ_REACH * Math.sin(t))
        .add(flatHeading.set(-eagle.skim.z, 0, eagle.skim.x).multiplyScalar(BUZZ_WIDTH * Math.sin(t) * Math.cos(t)));
      special.y = groundY + BUZZ_LOW + BUZZ_CLIMB * (1 - low);
      pose.glide = low;
      pose.talons = smoothstep(low, 0.6, 1);
      // The fox has led it away, so pick the tour up from here rather than dashing back
      if (touring() && u >= 0.85 && eagle.time - dt < 0.85 * BUZZ_SECONDS) joinTour();
      if (u >= 1) setEagleMode("cruise");
      break;
    }
    case "chase": {
      // Close in on the owl's tail, then give up and climb away
      const u = eagle.time / CHASE_SECONDS;
      eagle.weight = smoothstep(u, 0, 0.2) * (1 - smoothstep(u, 0.8, 1));
      owlRoutePoint(owlState.around - lerp(0.4, 0.1, smoothstep(u, 0, 0.6)), special);
      special.y = owl.position.y + 0.8 + 6 * smoothstep(u, 0.75, 1);
      pose.glide = 0;
      pose.talons = smoothstep(u, 0.4, 0.55) * (1 - smoothstep(u, 0.7, 0.8));
      if (touring() && u >= 0.8 && eagle.time - dt < 0.8 * CHASE_SECONDS) joinTour();
      if (u >= 1) setEagleMode("cruise");
      break;
    }
    case "dive": {
      // Wings held steady on the way down, talons forward, then a flat skim along the water
      const u = eagle.time / DIVE_SECONDS;
      eagle.weight = smoothstep(u, 0, 0.4);
      pose.glide = 1 - smoothstep(u, 0.38, 0.46);
      pose.talons = smoothstep(u, 0.25, 0.45);
      special.copy(eagle.catchPoint).addScaledVector(eagle.skim, (u - 0.5) * SKIM_LENGTH);
      if (!eagle.caught && u >= 0.5) {
        eagle.caught = true;
        fish.visible = true;
        fish.scale.setScalar(1);
        splash(special, 1);
        if (eagle.prey) hideShadowFish(eagle.prey, 6);
        eagle.prey = null;
      }
      // Carry the fish to the snag
      if (u >= 0.6) flyToPerch(special, eagle.skim);
      break;
    }
    case "toPerch": {
      const p = Math.min(eagle.time / eagle.travelSeconds, 1);
      eagle.weight = 1;
      bezier(eagle.start, eagle.control, PERCH, smoothstep(p, 0, 1), special);
      // Hard wingbeats climbing away, talons tucked, then swung forward again to land
      pose.glide = p > 0.8 ? 0 : 0.3;
      pose.talons = 1 - smoothstep(p, 0.1, 0.3) + smoothstep(p, 0.75, 0.95);
      if (p >= 1) setEagleMode("perched");
      break;
    }
    case "perched": {
      eagle.weight = 1;
      special.copy(PERCH);
      pose.fold = smoothstep(eagle.time, 0, 1.2);
      pose.talons = 1;
      if (eagle.shelter) {
        if (weather.phase !== "storm" && eagle.time > SHELTER_MIN_SECONDS) {
          eagle.shelter = false;
          setEagleMode("takeoff");
        }
        break;
      }
      pose.eat = smoothstep(eagle.time, 1.5, 2.5) * (1 - smoothstep(eagle.time, PERCH_SECONDS - 1.2, PERCH_SECONDS - 0.4));
      fish.scale.setScalar(1 - 0.75 * smoothstep(eagle.time, 2, PERCH_SECONDS - 1));
      if (eagle.time >= PERCH_SECONDS) {
        fish.visible = false;
        // Stay put if a storm has blown up while it was eating
        if (weather.phase === "storm") eagle.shelter = true;
        else setEagleMode("takeoff");
      }
      break;
    }
    case "takeoff": {
      // Drop off the branch, beat hard and climb away, easing back into the cruise
      const p = Math.min(eagle.time / TAKEOFF_SECONDS, 1);
      special.copy(PERCH).addScaledVector(perchFacing, 2 * p + 9 * p * p);
      special.y += 3.5 * p - 0.6 * Math.sin(p * Math.PI);
      eagle.weight = 1 - smoothstep(p, 0.3, 1);
      pose.fold = 1 - smoothstep(p, 0, 0.12);
      pose.glide = 0;
      pose.talons = 1 - smoothstep(p, 0.1, 0.4);
      if (p >= 1) {
        setEagleMode("cruise");
        eagle.diveTimer = 16 + Math.random() * 8;
      }
      break;
    }
  }
  current.lerpVectors(cruise, special, eagle.weight);
  return pose;
}

// The herd bolts when the eagle comes in low nearby, then settles after a while
const HERD_CALM_SECONDS = 15;
let herdCalm = 0;
function checkHerdAlarm(dt) {
  herdCalm -= dt;
  if (herdCalm > 0 || bird.position.y > groundY + 6) return;
  const near = herd.some(deer => Math.hypot(deer.position.x - bird.position.x, deer.position.z - bird.position.z) < DEER_ALARM_RADIUS);
  if (!near) return;
  herdCalm = HERD_CALM_SECONDS;
  for (const deer of herd) {
    deer.userData.targetHeading = Math.atan2(deer.position.x - bird.position.x, deer.position.z - bird.position.z);
    setDeerState(deer, "flee");
  }
}

// Camera: fixed at home, chasing the eagle when following, or orbiting it at whatever angle
// the viewer drags to with the left mouse button (at the chosen distance)
const FOLLOW_PITCH = 0.3;
const ORBIT_PITCH_LIMITS = [-0.2, 1.35];
const DRAG_RADIANS_PER_PIXEL = 0.006;
const orbit = { free: false, blend: 0, yaw: 0, pitch: 0, followYaw: 0, followPitch: 0, pointer: null, x: 0, y: 0 };
const chase = new THREE.Vector3();
const chaseSmoothed = camera.position.clone();
const chaseLook = new THREE.Vector3();
const freeView = new THREE.Vector3();
const baseView = new THREE.Vector3();
const baseLook = new THREE.Vector3();
const cameraLook = new THREE.Vector3();
const WORLD_UP = new THREE.Vector3(0, 1, 0);
const EYE_OFFSET = new THREE.Vector3(0, 0.1, 0.72); // just past the beak tip, in the eagle's own frame
let eyeBlend = 0;
const eyePosition = new THREE.Vector3();
const eyeLook = new THREE.Vector3();
const eyeUp = new THREE.Vector3();
const eyeRight = new THREE.Vector3();
const lookDirection = new THREE.Vector3();
function orbitOffset(yaw, pitch, radius, out) {
  return out.set(Math.sin(yaw) * Math.cos(pitch) * radius, Math.sin(pitch) * radius, Math.cos(yaw) * Math.cos(pitch) * radius);
}
function keepAboveGround(position) {
  position.y = Math.max(position.y, (insideLake(position.x, position.z, 0) ? LAKE.y : groundY) + 0.8);
  return position;
}
function updateCamera(dt) {
  // Following: behind the eagle, swung round by any drag
  const behind = Math.atan2(-heading.x, -heading.z);
  const followPitch = clamp(FOLLOW_PITCH + orbit.followPitch, ...ORBIT_PITCH_LIMITS);
  keepAboveGround(orbitOffset(behind + orbit.followYaw, followPitch, distance, chase).add(bird.position));
  chaseSmoothed.lerp(chase, easeFactor(dt, orbit.pointer === null ? 2.5 : 8));
  chaseLook.lerp(bird.position, easeFactor(dt, 6));
  // Not following: the viewer's own angle around the eagle, once they have dragged
  keepAboveGround(orbitOffset(orbit.yaw, orbit.pitch, distance, freeView).add(bird.position));
  orbit.blend += ((orbit.free && !touring() ? 1 : 0) - orbit.blend) * easeFactor(dt, 4);

  baseView.lerpVectors(HOME_POSITION, chaseSmoothed, followBlend);
  baseLook.lerpVectors(HOME_TARGET, chaseLook, followBlend);
  camera.position.lerpVectors(baseView, freeView, orbit.blend);
  cameraLook.lerpVectors(baseLook, bird.position, orbit.blend);

  // Eagle's-eye: just ahead of the beak, looking along the flight path (turned by any drag) and
  // banking with the eagle
  eyeBlend += ((eagleEye ? 1 : 0) - eyeBlend) * easeFactor(dt, 3);
  bird.updateMatrixWorld();
  bird.localToWorld(eyePosition.copy(EYE_OFFSET));
  lookDirection.copy(heading).applyAxisAngle(WORLD_UP, orbit.followYaw);
  lookDirection.applyAxisAngle(eyeRight.crossVectors(lookDirection, WORLD_UP).normalize(), -orbit.followPitch);
  eyeLook.copy(eyePosition).addScaledVector(lookDirection, 20);
  eyeUp.copy(WORLD_UP).applyQuaternion(bird.quaternion);
  camera.position.lerp(eyePosition, eyeBlend);
  cameraLook.lerp(eyeLook, eyeBlend);
  camera.up.copy(WORLD_UP).lerp(eyeUp, eyeBlend).normalize();
  camera.lookAt(cameraLook);
  camera.updateMatrixWorld();
}

// Keep the sun's shadow box centred where the action is: the lake normally, the eagle when the
// camera travels with it
const SHADOW_HOME = new THREE.Vector3(0, groundY, -25);
const shadowFocus = new THREE.Vector3();
function updateSunShadow() {
  shadowFocus.lerpVectors(SHADOW_HOME, bird.position, Math.max(followBlend, orbit.blend, eyeBlend)).setY(groundY);
  sun.target.position.copy(shadowFocus);
  sun.target.updateMatrixWorld();
  sun.position.copy(shadowFocus).addScaledVector(SUN_DIR, 150);
}

// Mirror the camera in the lake's surface and render what it sees for the water to sample
function renderReflection() {
  mirrorCamera.position.set(camera.position.x, 2 * LAKE.y - camera.position.y, camera.position.z);
  camera.getWorldDirection(mirrorLook);
  mirrorLook.y = -mirrorLook.y;
  mirrorCamera.lookAt(mirrorLook.add(mirrorCamera.position));
  mirrorCamera.updateMatrixWorld();
  mirrorMatrix.copy(MIRROR_BIAS).multiply(mirrorCamera.projectionMatrix).multiply(mirrorCamera.matrixWorldInverse);
  renderer.setRenderTarget(mirrorTarget);
  renderer.render(scene, mirrorCamera);
  renderer.setRenderTarget(null);
}

const readout = document.getElementById("readout");
const clockLabel = document.getElementById("clock");
let readoutTimer = 0;

const buttons = document.querySelectorAll(".controls button");
function setDistance(key) {
  targetDistance = DISTANCES[key];
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.distance === key)));
}
buttons.forEach(b => b.addEventListener("click", () => setDistance(b.dataset.distance)));

const followButton = document.getElementById("btn-follow");
const eyeButton = document.getElementById("btn-eye");
function setFollow(on) {
  const wasTouring = touring();
  follow = on;
  followButton.setAttribute("aria-pressed", String(on));
  if (on && !wasTouring) joinTour();
}
function setEagleEye(on) {
  const wasTouring = touring();
  eagleEye = on;
  eyeButton.setAttribute("aria-pressed", String(on));
  if (on && !wasTouring) joinTour();
}
eyeButton.addEventListener("click", () => setEagleEye(!eagleEye));
// Join the landscape tour at the point nearest the eagle, so it doesn't dash across the map
function joinTour() {
  const probe = new THREE.Vector3();
  const period = (Math.PI * 2) / TOUR_RATE;
  const samples = 240;
  let best = Infinity;
  for (let i = 0; i < samples; i++) {
    const time = (i / samples) * period;
    const gap = tourPoint(time, probe).distanceToSquared(bird.position);
    if (gap < best) {
      best = gap;
      tourTime = time;
    }
  }
}
followButton.addEventListener("click", () => setFollow(!follow));

const soundButton = document.getElementById("btn-sound");
function setSound(on) {
  if (on && !sound.ctx) {
    try {
      startSound();
    } catch {
      soundButton.disabled = true;
      soundButton.title = "This browser can't play generated sound";
      return;
    }
  }
  sound.on = on;
  if (sound.ctx) (on ? sound.ctx.resume() : sound.ctx.suspend()).catch(() => {});
  soundButton.setAttribute("aria-pressed", String(on));
}
soundButton.addEventListener("click", () => setSound(!sound.on));

// Left-drag (or a one-finger drag) orbits the view around the eagle
canvas.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  orbit.pointer = e.pointerId;
  orbit.x = e.clientX;
  orbit.y = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== orbit.pointer) return;
  const dx = (e.clientX - orbit.x) * DRAG_RADIANS_PER_PIXEL;
  const dy = (e.clientY - orbit.y) * DRAG_RADIANS_PER_PIXEL;
  orbit.x = e.clientX;
  orbit.y = e.clientY;
  // Following, this swings the chase camera round; riding along, it looks around
  if (touring()) {
    orbit.followYaw -= dx;
    orbit.followPitch = clamp(orbit.followPitch + dy, ORBIT_PITCH_LIMITS[0] - FOLLOW_PITCH, ORBIT_PITCH_LIMITS[1] - FOLLOW_PITCH);
    return;
  }
  if (!orbit.free) {
    // Start from wherever the camera is now, so the view doesn't jump
    const toCamera = camera.position.clone().sub(bird.position);
    orbit.yaw = Math.atan2(toCamera.x, toCamera.z);
    orbit.pitch = Math.asin(clamp(toCamera.y / Math.max(toCamera.length(), 1e-3), -1, 1));
    orbit.free = true;
  }
  orbit.yaw -= dx;
  orbit.pitch = clamp(orbit.pitch + dy, ...ORBIT_PITCH_LIMITS);
});
function endDrag(e) {
  if (e.pointerId !== orbit.pointer) return;
  orbit.pointer = null;
  canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
function resetView() {
  orbit.free = false;
  orbit.followYaw = 0;
  orbit.followPitch = 0;
}
canvas.addEventListener("dblclick", resetView);

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  const distanceKey = { "1": "close", "2": "away", "3": "far" }[key];
  if (distanceKey) setDistance(distanceKey);
  else if (key === "f") setFollow(!follow);
  else if (key === "e") setEagleEye(!eagleEye);
  else if (key === "m") setSound(!sound.on);
  else if (key === "r") resetView();
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  Object.assign(mirrorCamera, { fov: camera.fov, aspect: camera.aspect, near: camera.near, far: camera.far });
  mirrorCamera.updateProjectionMatrix();
  const pixelRatio = renderer.getPixelRatio();
  mirrorTarget.setSize(Math.round((innerWidth * pixelRatio) / 2), Math.round((innerHeight * pixelRatio) / 2));
  fireflyMat.uniforms.scale.value = 60 * pixelRatio;
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05) * motionScale;
  elapsed += dt;

  const lastHour = hour;
  hour = (hour + dt * (hour < 5 || hour >= 21 ? NIGHT_HOURS_PER_SECOND : DAY_HOURS_PER_SECOND)) % 24;
  // The moon moves on a phase each day (at noon, while it's down); the first night and about
  // half of the rest bring the northern lights
  if (lastHour < 12 && hour >= 12) moonPhase = MOON_START_PHASE + (++day * Math.PI * 2) / LUNAR_NIGHTS;
  if (lastHour < SUNSET && hour >= SUNSET) auroraTonight = nightsSeen++ === 0 || Math.random() < AURORA_CHANCE;
  updateWeather(dt);
  updateDayCycle();

  const pose = updateFlightPath(dt);
  velocity.subVectors(current, previous);
  previous.copy(current);
  if (eagle.mode === "perched") heading.lerp(perchFacing, easeFactor(dt, 3)).normalize();
  else if (velocity.lengthSq() > 1e-10) heading.lerp(velocity.normalize(), easeFactor(dt, 6)).normalize();

  // Bank into turns, based on how fast the heading swings left or right
  const yawRate = (lastHeading.z * heading.x - lastHeading.x * heading.z) / Math.max(dt, 1e-3);
  lastHeading.copy(heading);
  roll += (clamp(-yawRate * 0.6, -0.8, 0.8) * (1 - pose.fold) - roll) * easeFactor(dt, 4);

  // Slow, deep wingbeats between long soaring stretches with upturned tips; folded when perched
  const cruiseGlide = smoothstep(Math.sin(flightTime * 0.35), -0.1, 0.3);
  const glide = pose.glide === null ? cruiseGlide : lerp(cruiseGlide, pose.glide, eagle.weight);
  const spread = 1 - pose.fold;
  const amplitude = lerp(0.5, 0.03, glide) * spread;
  flapPhase += dt * lerp(6, 1.5, glide);
  for (const { shoulder, wrist, side } of bird.userData.wings) {
    shoulder.rotation.z = side * (Math.sin(flapPhase) * amplitude + 0.06 - 0.12 * pose.fold);
    shoulder.rotation.y = side * 1.35 * pose.fold;
    shoulder.scale.x = 1 - 0.45 * pose.fold;
    wrist.rotation.z = side * (Math.sin(flapPhase - 0.7) * amplitude * 0.5 + 0.1 * spread);
  }
  for (const foot of bird.userData.feet) foot.rotation.x = lerp(-Math.PI / 2, -1.15 * Math.PI, pose.talons);
  bird.userData.head.rotation.x = pose.eat * (0.9 + 0.35 * Math.max(Math.sin(elapsed * 7), 0));
  if (fish.visible) fish.rotation.y = Math.sin(elapsed * 20) * 0.3 * (1 - pose.eat);

  bird.position.copy(current);
  bird.position.y -= Math.sin(flapPhase) * 0.04 * (1 - glide) * spread;
  bird.lookAt(lookTarget.copy(bird.position).add(heading));
  bird.rotateZ(roll);
  bird.rotateX(-0.6 * pose.fold); // sit upright on the branch

  checkHerdAlarm(dt);
  for (const cloud of clouds) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 160) cloud.position.x = -160;
  }
  for (const flock of flocks) {
    flock.position.x += flock.userData.dir * flock.userData.speed * dt;
    if (flock.position.x * flock.userData.dir > FLOCK_EDGE) launchFlock(flock, false);
    for (const farBird of flock.children) {
      for (const { wing, side } of farBird.userData.wings) wing.rotation.z = side * Math.sin(elapsed * 7 + farBird.userData.offset) * 0.6;
    }
  }
  updateFox(dt, elapsed);
  for (const deer of herd) updateDeer(deer, dt, elapsed);
  updateDucks(dt, elapsed);
  updateLilyPads(dt, elapsed);
  updateFishShadows(dt, elapsed);
  updateJumper(dt);
  updateSplashes(dt);
  updateBats(elapsed);
  updateOwl(dt, elapsed);
  updateHeron(dt, elapsed);
  updateCamp(dt, elapsed);
  const treeWind = swayUniforms.wind.value;
  for (const tree of trees) {
    const { phase } = tree.userData;
    tree.rotation.z = Math.sin(elapsed * 1.1 + phase) * TREE_SWAY * treeWind;
    tree.rotation.x = Math.sin(elapsed * 0.8 + phase * 1.3) * TREE_SWAY * 0.6 * treeWind;
  }

  updateCamera(dt);
  updateSunShadow();
  skyDome.position.copy(camera.position);
  stars.position.copy(camera.position);
  aurora.position.set(camera.position.x, camera.position.y + 130, camera.position.z);
  updateShootingStar(dt);
  updateRain(dt);
  updateBeams(beamAmount, dayColors.sun);
  updateMist(dt, mistAmount, mistColor);
  swayUniforms.time.value = elapsed;
  fireflyMat.uniforms.time.value = elapsed;
  waterUniforms.time.value = elapsed;
  aurora.material.uniforms.time.value = elapsed;
  cloudUniforms.cloudTime.value = elapsed;
  updateSound(dt, elapsed);

  readoutTimer -= dt;
  if (readoutTimer <= 0) {
    readout.textContent = bird.position.distanceTo(camera.position).toFixed(1);
    const pad = n => String(Math.floor(n)).padStart(2, "0");
    const northernLights = aurora.visible && aurora.material.uniforms.opacity.value > 0.3 ? "Northern lights behind you" : "";
    clockLabel.textContent = [`${pad(hour)}:${pad((hour % 1) * 60)}`, dayPart(hour), weatherLabel(), northernLights].filter(Boolean).join(" · ");
    readoutTimer = 0.1;
  }

  renderer.shadowMap.needsUpdate = true;
  renderReflection();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</html>
